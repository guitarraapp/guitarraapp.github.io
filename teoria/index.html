<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diccionario de acordes</title>
<style>
:root{--bg:#f6f4ee;--pn:#fff;--ln:#d9d5c8;--tx:#1c1d22;--dm:#666870;--cr:#d98200;--ct:#2e9b5a;--cf:#3a7bd5;--cs:#c2417a;--co:#7b6fb5;--on:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171d;--pn:#1e2128;--ln:#32363f;--tx:#f4f2ec;--dm:#9a9ca6;--cr:#ffb224;--ct:#6fd68e;--cf:#6fa8ff;--cs:#ff7eb6;--co:#b3a6ff;--on:#111}}
:root[data-theme="dark"]{--bg:#15171d;--pn:#1e2128;--ln:#32363f;--tx:#f4f2ec;--dm:#9a9ca6;--cr:#ffb224;--ct:#6fd68e;--cf:#6fa8ff;--cs:#ff7eb6;--co:#b3a6ff;--on:#111}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx)}
#app{max-width:760px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;font-weight:700;color:var(--cr)}
main{flex:1;overflow-y:auto;padding:4px 14px 18px}
nav{display:flex;border-top:1px solid var(--ln);background:var(--pn);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;height:52px;border:0;background:none;color:var(--dm);font-size:.78rem;font-weight:600}
nav button.on{color:var(--cr);box-shadow:inset 0 3px var(--cr)}
.lead{font-size:.92rem;line-height:1.45;margin:6px 0 10px}.dim{color:var(--dm);font-size:.82rem}
h2{font-size:1.9rem;margin:6px 0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}
.chip{flex:none;min-height:40px;padding:0 13px;border-radius:12px;border:1px solid var(--ln);background:var(--pn);color:var(--tx);font-size:.95rem}
.chip.sel{background:var(--cr);color:var(--on);border-color:var(--cr);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:6px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:12px;text-align:left;color:var(--tx)}
.card p{font-size:.85rem;line-height:1.4;margin-top:4px}.ct{font-weight:700;margin:2px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.go{width:100%;margin-top:8px;font-size:1rem}.rt{text-align:right}
.big{font-size:1.5rem;font-weight:800;color:var(--c,var(--tx))}
.p{display:inline-block;min-width:28px;text-align:center;padding:2px 7px;margin:2px;border-radius:9px;background:var(--c);color:var(--on);font-weight:700;font-size:.82rem}
.r{--c:var(--cr)}.t{--c:var(--ct)}.f{--c:var(--cf)}.s{--c:var(--cs)}.o{--c:var(--co)}
input{width:100%;height:48px;border-radius:12px;border:1px solid var(--ln);background:var(--pn);color:var(--tx);font-size:16px;padding:0 12px;margin:2px 0 4px}
svg{display:block;margin:4px auto;max-width:100%}svg text{font:600 11px sans-serif;text-anchor:middle;fill:var(--tx)}
.gl{stroke:var(--dm);stroke-width:1.2}.nut{stroke-width:5;stroke:var(--tx)}
.d circle{fill:var(--c)}.d text{fill:var(--on);font-size:11px}
.h circle{fill:var(--bg);stroke:var(--c);stroke-width:2}.h text{fill:var(--c)}
svg .tx{fill:var(--dm);font-size:9px}
.neck{overflow-x:auto;border:1px solid var(--ln);border-radius:14px;background:var(--pn);margin-top:8px}.neck svg{max-width:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--cr);outline-offset:2px}
</style></head><body>
<div id="app"><header><span>🎸 Diccionario de acordes</span><button class="chip" id="sol"></button></header>
<main id="main"></main>
<nav id="nav"></nav></div>
<script>
const $=s=>document.querySelector(s);
const RN=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'],NS=['Do','Do♯','Re','Mi♭','Mi','Fa','Fa♯','Sol','La♭','La','Si♭','Si'];
let S={tab:0,root:9,q:'m',sol:0,sc:0,qs:''};
try{Object.assign(S,JSON.parse(localStorage.getItem('chords1')||'{}'))}catch(e){}
const sv=()=>{try{localStorage.setItem('chords1',JSON.stringify(S))}catch(e){}};
const nm=i=>(S.sol?NS:RN)[((i%12)+12)%12];
const IV=[[0,'R','Unísono / fundamental','La nota que da nombre al acorde; todo se mide desde ella.'],[1,'♭2','2ª menor','Medio tono. Muy tensa, roza la nota vecina.'],[2,'2','2ª mayor','Un tono. En acordes se llama 9ª (sus2, add9).'],[3,'♭3','3ª menor','Da el carácter menor: triste, oscuro.'],[4,'3','3ª mayor','Da el carácter mayor: alegre, brillante.'],[5,'4','4ª justa','Estable pero pide resolver; en sus4 sustituye a la 3ª.'],[6,'♭5','5ª disminuida (tritono)','Muy inestable. Base de dim y m7♭5.'],[7,'5','5ª justa','Fuerza sin decir mayor ni menor: la base del power chord.'],[8,'♯5','5ª aumentada (♭6)','Tensa y ambigua; es el acorde aug.'],[9,'6','6ª mayor','Dulce y abierta. En dim7 hace de 7ª disminuida.'],[10,'♭7','7ª menor','Sabor a blues/dominante: pide resolver.'],[11,'7','7ª mayor','Elegante y soñadora (maj7).']];
const Q=[['','','mayor|major|maj|M','0 4 7','R 3 5'],['m','m','menor|minor|min|-','0 3 7','R ♭3 5'],['5','5','power chord|powerchord|quinta','0 7','R 5'],['7','7','dominante|séptima|septima','0 4 7 10','R 3 5 ♭7'],['maj7','maj7','séptima mayor|M7|Δ','0 4 7 11','R 3 5 7'],['m7','m7','menor séptima|min7|-7','0 3 7 10','R ♭3 5 ♭7'],['m7b5','m7♭5','semidisminuido|ø','0 3 6 10','R ♭3 ♭5 ♭7'],['dim','dim','disminuido|°','0 3 6','R ♭3 ♭5'],['dim7','dim7','disminuido séptima|°7','0 3 6 9','R ♭3 ♭5 ♭♭7'],['aug','aug','aumentado|+','0 4 8','R 3 ♯5'],['sus2','sus2','suspendido 2','0 2 7','R 2 5'],['sus4','sus4','suspendido 4','0 5 7','R 4 5'],['6','6','sexta|maj6','0 4 7 9','R 3 5 6'],['m6','m6','menor sexta|min6','0 3 7 9','R ♭3 5 6'],['add9','add9','añadida 9|add 9','0 4 7 2','R 3 5 9']].map(([id,sy,al,s,l])=>({id,sy,al:[id,...al.split('|')],s:s.split(' ').map(Number),l:l.split(' ')}));
const qo=id=>Q.find(q=>q.id===id)||Q[0];
const IM=['R','♭2','2','♭3','3','4','♭5','5','♯5','6','♭7','7'];
const pc=l=>l==='R'?'r':/3/.test(l)?'t':/5/.test(l)?'f':/7/.test(l)?'s':'o';
const lab=(q,iv)=>{const i=q.s.indexOf(iv);return i>=0?q.l[i]:IM[iv]};
const pill=l=>`<span class="p ${pc(l)}">${l}</span>`;
/* formas en posición abierta (cuerda 6→1); se desplazan n trastes para otras tónicas */
const OM=[40,45,50,55,59,64];
const EF={'':'022100',m:'022000','5':'022xxx','7':'020100',maj7:'021100',m7:'020000',aug:'032110',sus4:'022200','6':'022120',m6:'022020'};
const AF={'':'x02220',m:'x02210','5':'x022xx','7':'x02020',maj7:'x02120',m7:'x02010',m7b5:'x0101x',dim:'x0121x',dim7:'x01212',aug:'x03221',sus2:'x02200',sus4:'x02230','6':'x02222',m6:'x02212',add9:'x02420'};
const OP={'C|7':'x32310','G|7':'320001','D|7':'xx0212','D|m':'xx0231','C|maj7':'x32000','G|maj7':'320002','D|maj7':'xx0222','D|sus4':'xx0233','D|sus2':'xx0230'},LT={0:'C',2:'D',7:'G'};
const CG=[['C',0,'x32010'],['A',9,'x02220'],['G',7,'320003'],['E',4,'022100'],['D',2,'xx0232']];
const sh=(s,n)=>[...s].map(c=>c==='x'?-1:+c+n);
function voic(r,q){
  const v=[],add=(l,s,b)=>{const n=(r-b+12)%12;v.push({l:l+(n?' · cejilla traste '+n:' · abierta'),f:sh(s,n),n})};
  if(q==='')CG.forEach(([l,b,s])=>add('Forma de '+l,s,b));
  else{const k=(LT[r]||'?')+'|'+q;if(OP[k])v.push({l:'Posición abierta',f:sh(OP[k],0),n:0});
    if(EF[q])add('Forma de E',EF[q],4);if(AF[q])add('Forma de A',AF[q],9)}
  const key=x=>x.n?Math.min(...x.f.filter(a=>a>0)):0;
  return v.sort((a,b)=>key(a)-key(b));
}
function dia(r,q,v){
  const Qd=qo(q),fr=v.f,pr=fr.filter(x=>x>0),lo=Math.min(...pr,99),hi=Math.max(...pr,0),st=hi<=5?1:lo,X=s=>36+s*34,Y=f=>34+(f-st+.5)*36,fin={};
  let g='';
  for(let i=0;i<=5;i++)g+=`<line x1="36" x2="206" y1="${34+i*36}" y2="${34+i*36}" class="gl${i==0&&st==1?' nut':''}"/>`;
  for(let s=0;s<6;s++)g+=`<line x1="${X(s)}" x2="${X(s)}" y1="34" y2="214" class="gl"/>`;
  if(st>1)g+=`<text x="14" y="57" class="tx" style="font-size:12px">${st}ª</text>`;
  let c=v.n>0?1:0;
  if(v.n>0){const ix=fr.map((f,s)=>f===lo?s:-1).filter(s=>s>=0);ix.forEach(s=>fin[s]=1);
    if(ix.length>1)g+=`<rect x="${X(ix[0])-13}" y="${Y(lo)-13}" width="${X(ix[ix.length-1])-X(ix[0])+26}" height="26" rx="13" fill="var(--cr)" opacity=".25"/>`}
  fr.map((f,s)=>({f,s})).filter(o=>o.f>0&&!fin[o.s]).sort((a,b)=>a.f-b.f||(v.n?b.s-a.s:a.s-b.s)).forEach(o=>fin[o.s]=Math.min(4,++c));
  fr.forEach((f,s)=>{
    if(f<0){g+=`<text x="${X(s)}" y="23" style="font-size:15px;fill:var(--dm)">×</text>`;return}
    const sm=(OM[s]+f)%12,l=lab(Qd,(sm-r+12)%12);
    g+=f===0?`<g class="h ${pc(l)}"><circle cx="${X(s)}" cy="17" r="11"/><text x="${X(s)}" y="21">${l}</text></g>`
      :`<g class="d ${pc(l)}"><circle cx="${X(s)}" cy="${Y(f)}" r="13"/><text x="${X(s)}" y="${Y(f)+4}">${l}</text></g>`;
    g+=`<text x="${X(s)}" y="236">${nm(sm)}</text><text x="${X(s)}" y="256" style="fill:var(--dm)">${fin[s]||''}</text>`;
  });
  g+=`<text x="14" y="236" class="tx">nota</text><text x="14" y="256" class="tx">dedo</text>`;
  const ms=fr.map((f,s)=>f>=0?OM[s]+f:null).filter(x=>x!==null).join(',');
  return `<div class="card"><div class="ct">${v.l}</div><svg viewBox="0 0 250 266" width="250">${g}</svg><div style="text-align:center"><button class="chip" data-p="${ms}" data-g=".06">▶ Sonar</button></div></div>`;
}
let ac;function play(ms,g){ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();const t=ac.currentTime;
  ms.forEach((m,i)=>{const o=ac.createOscillator(),h=ac.createGain(),s=t+i*g;o.type='triangle';o.frequency.value=440*2**((m-69)/12);
    h.gain.setValueAtTime(0,s);h.gain.linearRampToValueAtTime(.14,s+.01);h.gain.exponentialRampToValueAtTime(.001,s+1.8);o.connect(h);h.connect(ac.destination);o.start(s);o.stop(s+1.9)})}
const rcH=()=>RN.map((_,i)=>`<button class="chip${S.root===i?' sel':''}" data-r="${i}">${nm(i)}</button>`).join('');
const rc=()=>`<div class="chips" id="rc">${rcH()}</div>`;
const SC=[['Mayor','0 2 4 5 7 9 11','R 2 3 4 5 6 7'],['Menor natural','0 2 3 5 7 8 10','R 2 ♭3 4 5 ♭6 ♭7'],['Pentatónica menor','0 3 5 7 10','R ♭3 4 5 ♭7'],['Pentatónica mayor','0 2 4 7 9','R 2 3 5 6'],['Blues','0 3 5 6 7 10','R ♭3 4 ♭5 5 ♭7'],['Dórica','0 2 3 5 7 9 10','R 2 ♭3 4 5 6 ♭7'],['Mixolidia','0 2 4 5 7 9 10','R 2 3 4 5 6 ♭7']].map(([n,s,l])=>({n,s:s.split(' ').map(Number),l:l.split(' ')}));
function neck(sc,r){
  const W=44+12*48,OPN=[4,9,2,7,11,4];let g='';
  for(let f=0;f<=12;f++){g+=`<line x1="${40+f*48}" x2="${40+f*48}" y1="14" y2="158" class="gl${f==0?' nut':''}"/>`;if(f)g+=`<text x="${16+f*48+0}" y="184" class="tx" style="font-size:10px">${f}</text>`}
  for(let i=0;i<6;i++)g+=`<line x1="40" x2="${W-4}" y1="${27+i*26}" y2="${27+i*26}" class="gl"/>`;
  for(let i=0;i<6;i++){const s=5-i;for(let f=0;f<=12;f++){const iv=((OPN[s]+f)%12-r+12)%12,k=sc.s.indexOf(iv);if(k<0)continue;const l=sc.l[k],cx=f?40+(f-.5)*48:20;
    g+=`<g class="d ${pc(l)}"><circle cx="${cx}" cy="${27+i*26}" r="10"/><text x="${cx}" y="${31+i*26}" style="font-size:10px">${l}</text></g>`}}
  return `<div class="neck"><svg viewBox="0 0 ${W} 190" width="${W}">${g}</svg></div>`;
}
const T=[
()=>`<p class="lead">Un acorde es una <b>fundamental</b> más otras notas medidas en <b>intervalos</b> (distancia en semitonos; en la guitarra, cada traste es un semitono). Elige una tónica y pulsa ▶ para oír cada intervalo desde ella.</p>${rc()}<div class="grid">${IV.map(([n,a,t,d])=>`<div class="card"><div class="row"><b class="big ${pc(a)}">${a}</b><button class="chip" data-p="${60+S.root},${60+S.root+n}" data-g=".5">▶</button></div><div class="ct">${t}</div><div class="dim">${n} semitono${n==1?'':'s'} · ${nm(S.root)} → ${nm(S.root+n)}</div><p>${d}</p></div>`).join('')}</div>`,
()=>`<p class="lead">Fórmulas de cada tipo de acorde y sus nombres alternativos. Pulsa uno para ver sus diagramas.</p>${rc()}<input id="qs" type="search" placeholder="Busca: Am7, sol menor, power chord, F#dim…" value="${S.qs}" autocomplete="off"><div id="lst"></div>`,
()=>{const q=qo(S.q),vs=voic(S.root,S.q);return `<h2>${nm(S.root)}${q.sy}</h2><div>${q.l.map((l,i)=>pill(l)+' '+nm(S.root+q.s[i])).join(' &nbsp; ')}</div><div class="dim" style="margin:4px 0">${q.al.slice(1).join(' · ')||'mayor'}</div>${rc()}<div class="chips">${Q.map(x=>`<button class="chip${x.id===S.q?' sel':''}" data-q="${x.id}">${x.sy||'mayor'}</button>`).join('')}</div><div class="grid">${vs.map(v=>dia(S.root,S.q,v)).join('')||'<p class="dim">Sin formas guardadas para este acorde.</p>'}</div><p class="dim" style="margin-top:10px">Dentro del círculo: intervalo (R fundamental, 3 tercera, 5 quinta, 7 séptima…). Dedos: 1 índice, 2 medio, 3 anular, 4 meñique; es una sugerencia estándar.</p>`},
()=>`<p class="lead"><b>CAGED</b>: el acorde mayor se puede tocar con cinco formas (las de los acordes abiertos C, A, G, E, D) que encajan una tras otra por todo el mástil. Aquí ves ${nm(S.root)} mayor en sus cinco posiciones, de grave a agudo.</p>${rc()}<div class="grid">${voic(S.root,'').map(v=>dia(S.root,'',v)).join('')}</div><p class="dim" style="margin-top:10px">En desarrollo: mástil completo con las cinco formas enlazadas, versiones menores y escalas sobre cada forma.</p>`,
()=>{const sc=SC[S.sc]||SC[0];return `<p class="lead">Embrión de escalas: notas, intervalos y su posición en los 12 primeros trastes.</p>${rc()}<div class="chips">${SC.map((x,i)=>`<button class="chip${i===S.sc?' sel':''}" data-sc="${i}">${x.n}</button>`).join('')}</div><div>${sc.l.map((l,i)=>pill(l)+' '+nm(S.root+sc.s[i])).join(' &nbsp; ')}</div>${neck(sc,S.root)}`}
];
const NAV=['Intervalos','Acordes','Diagramas','CAGED','Escalas'];
function lst(){
  const s=S.qs.toLowerCase().replace(/♯/g,'#').replace(/♭/g,'b').trim(),m=s.match(/^(sol|do|re|mi|fa|la|si|[a-g])\s*([#b]?)/);
  const mt=r=>{if(!r)return Q;const e=Q.filter(q=>q.al.includes(r));return e.length?e:Q.filter(q=>q.al.some(a=>a.includes(r)))};
  let res=mt(s);
  if(m){const r=s.slice(m[0].length).trim(),x=mt(r);if(x.length){res=x;const B={c:0,d:2,e:4,f:5,g:7,a:9,b:11,do:0,re:2,mi:4,fa:5,sol:7,la:9,si:11};S.root=(B[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0)+12)%12}}
  $('#rc').innerHTML=rcH();
  $('#lst').innerHTML=res.map(q=>`<button class="card row go" data-go="${q.id}"><div><b class="big">${nm(S.root)}${q.sy}</b><div class="dim">${q.al.slice(1,3).join(' · ')}</div></div><div class="rt"><div>${q.l.map(pill).join('')}</div><div class="dim">${q.s.map(i=>nm(S.root+i)).join(' · ')}</div></div></button>`).join('')||'<p class="dim">Sin resultados</p>';
  window.first=res[0];
}
function draw(){
  $('#main').innerHTML=T[S.tab]();
  $('#nav').innerHTML=NAV.map((n,i)=>`<button data-tab="${i}" class="${i===S.tab?'on':''}">${n}</button>`).join('');
  $('#sol').textContent=S.sol?'Do Re Mi':'C D E';
  if(S.tab===1){lst();const i=$('#qs');i.oninput=()=>{S.qs=i.value;lst();sv()};i.onkeydown=e=>{if(e.key==='Enter'&&window.first){S.q=window.first.id;S.tab=2;sv();draw()}}}
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.p){play(d.p.split(',').map(Number),+d.g);return}
  let top=0;
  if(d.tab!==undefined){S.tab=+d.tab;top=1}else if(d.r!==undefined)S.root=+d.r;else if(d.q!==undefined)S.q=d.q;
  else if(d.go!==undefined){S.q=d.go;S.tab=2;top=1}else if(d.sc!==undefined)S.sc=+d.sc;else if(b.id==='sol')S.sol^=1;else return;
  sv();draw();if(top)$('#main').scrollTop=0;
});
draw();
</script></body></html>
