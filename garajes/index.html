<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Garajes</title>
<style>
:root{--bg:#f2f4f3;--c:#fff;--t:#1c2321;--m:#66726d;--b:#d9dfdc;--p:#1d6b57;--g:#1f9d55;--y:#d99a00;--r:#d23b3b}
@media(prefers-color-scheme:dark){:root{--bg:#121615;--c:#1b211f;--t:#e6ebe8;--m:#97a39e;--b:#2f3835;--p:#4fb596}}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--t)}
[hidden]{display:none!important}
.top{position:sticky;top:0;z-index:5;background:var(--c)}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top))}
header b{font-size:16px}#lk{margin:0;padding:7px 12px;font-size:14px;background:var(--m)}
body.ed #lk{background:var(--y);color:#222}body.ed header{box-shadow:inset 0 -3px 0 var(--y)}
nav{display:flex;background:var(--c);border-bottom:1px solid var(--b)}
nav button{flex:1;margin:0;padding:12px 2px;font-size:13px;border:0;border-radius:0;background:none;color:var(--m);border-bottom:3px solid transparent}
nav button.on{color:var(--p);border-color:var(--p);font-weight:600}
main{max-width:900px;margin:auto;padding:12px}
.card,.sum div{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:12px}.card{margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}.grid .card{margin:0}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px;margin-bottom:12px}.sum b{display:block;font-size:20px}
.pl{border-left:6px solid var(--b);cursor:pointer}.verde{border-left-color:var(--g)}.amarillo{border-left-color:var(--y)}.rojo{border-left-color:var(--r)}
.bd{font-size:12px;padding:2px 8px;border-radius:9px;color:#fff;background:var(--m)}.bd.verde{background:var(--g)}.bd.amarillo{background:var(--y)}.bd.rojo{background:var(--r)}
small{color:var(--m)}label{display:block;margin:8px 0 2px;font-size:13px;color:var(--m)}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);font:inherit}
button{padding:9px 14px;border:0;border-radius:8px;background:var(--p);color:#fff;font:inherit;margin:8px 6px 0 0;cursor:pointer}
button.s{background:var(--m)}button.d{background:var(--r)}button:disabled{opacity:.4}
dialog{width:min(100vw - 16px,640px);max-height:calc(100vh - 16px);max-height:calc(100dvh - 16px);border:0;border-radius:12px;padding:0;background:var(--c);color:var(--t);overflow:hidden}
dialog[open]{display:flex;flex-direction:column}
.act{position:sticky;bottom:0;margin:12px -16px -16px;padding:8px 16px calc(8px + env(safe-area-inset-bottom));background:var(--c);border-top:1px solid var(--b);display:flex;flex-wrap:wrap;gap:6px}.act button{margin:0;flex:1 1 auto}
.x{position:sticky;top:0;float:right;margin:0 0 0 8px;width:36px;height:36px;padding:0;border-radius:50%;z-index:2}
.ic{float:right;margin:0 0 0 6px;padding:4px 9px;background:none;border:1px solid var(--b);color:var(--t)}
summary{cursor:pointer;font-size:16px;padding:2px 0}
@media(max-width:600px){input,select,textarea{font-size:16px}}
dialog::backdrop{background:#0008}.mb{padding:16px;overflow-y:auto;overscroll-behavior:contain;flex:1;min-height:0}
.row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--b);cursor:pointer}
.ch{display:flex;flex-wrap:wrap;gap:5px}.ch span,.ch label{padding:5px 8px;border-radius:8px;border:1px solid var(--b);font-size:12px;cursor:pointer;margin:0;color:var(--t);display:inline-flex;gap:4px;align-items:center;width:auto}
.ch .pg{background:var(--g);color:#fff;border-color:var(--g)}.ch .lb{background:#8352c9;color:#fff}.ch .pe{background:var(--r);color:#fff}.ch .fu{opacity:.55}.ch input{width:auto;margin:0}
table{width:100%;border-collapse:collapse;margin:6px 0 14px}td,th{padding:6px;border-bottom:1px solid var(--b);text-align:left}td:last-child,th:last-child{text-align:right}
.bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}.bar>*{flex:1;min-width:120px}.warn{background:#fff3cd;color:#5c4400;padding:10px;border-radius:8px;margin-bottom:10px}
.vis{display:flex;align-items:center;gap:10px;margin:0 0 12px;padding:4px 6px 4px 14px;background:var(--c);border:1px solid var(--b);border-radius:999px}.vis span{color:var(--m);font-size:13px;white-space:nowrap}.vis select{flex:1;width:auto;border:0;background:transparent;font-weight:600;color:var(--p)}
.ina{opacity:.8}.grid .card{scroll-margin:130px 0 20px}
@media print{.top,.bar,.vis,button{display:none}}
</style></head>
<body><div class=top><header><b>🅿️ Garajes</b><button id=lk onclick="tog()"></button></header><nav><button id=t0 onclick="go(0)">Panel</button><button id=t1 onclick="go(1)">Inquilinos</button><button id=t2 onclick="go(2)">Pagos</button><button id=t3 onclick="go(3)">Informes</button><button id=t4 onclick="go(4)">Ajustes</button></nav></div><main id=v></main><dialog id=dlg></dialog>
<script>
const K='garajes_v1',$=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const defaults=()=>({plazas:[],contratos:[],pagos:[],ultimaCopia:null,cfg:{gracia:15,modo:'dias',orden:'asc',lugares:['Viene a mi casa','Voy a su oficina','Bizum / transferencia'],plantilla:'Hola {nombre}, te recuerdo el pago de la plaza {plaza} ({meses}): {importe}. Gracias.'}});
function load(){try{const d=JSON.parse(localStorage.getItem(K));if(d&&d.plazas){const x=defaults();x.cfg=Object.assign(x.cfg,d.cfg);return Object.assign(x,d,{cfg:x.cfg})}}catch(e){}return defaults()}
let S=load(),tab=0,flt='act',F={pl:'',c:'',d:'',h:'',m:'',b:'cobro'};
const save=()=>localStorage.setItem(K,JSON.stringify(S));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eur=n=>(+n||0).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const fd=d=>d?d.split('-').reverse().join('/'):'—';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const ym=d=>d.slice(0,7);
const addM=(m,n)=>{let[y,o]=m.split('-').map(Number);o+=n-1;y+=Math.floor(o/12);o=((o%12)+12)%12;return y+'-'+String(o+1).padStart(2,'0')};
const mlabel=m=>['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][+m.slice(5)-1]+' '+m.slice(2,4);
const plaza=id=>S.plazas.find(p=>p.id==id),contr=id=>S.contratos.find(c=>c.id==id),pagosC=c=>S.pagos.filter(p=>p.c==c.id);
const fechaC=c=>c.inicio||pagosC(c).map(p=>p.f).sort()[0]||'9999';
const fp=p=>S.contratos.filter(c=>c.pl==p.id).map(fechaC).sort()[0]||'9999-'+p.num;
function migra(){if(S.cfg.ordenPlazas)return;S.plazas.sort((a,b)=>fp(a).localeCompare(fp(b))*(S.cfg.orden=='asc'?1:-1));S.cfg.ordenPlazas=1;save()}migra();
const activo=p=>S.contratos.filter(c=>c.pl==p.id&&!(c.fin&&c.fin<today())).sort((a,b)=>fechaC(b).localeCompare(fechaC(a)))[0];
function cubiertos(c){const m={};(c.libres||[]).forEach(x=>m[x]='libre');pagosC(c).forEach(p=>(p.meses||[]).forEach(x=>m[x]=p.id));return m}
const ini=c=>c.inicio?ym(c.inicio):(Object.keys(cubiertos(c)).sort()[0]||ym(today()));
function pend(c){const cov=cubiertos(c),t=ym(today()),e=c.fin&&ym(c.fin)<t?ym(c.fin):t,L=[];let m=ini(c);while(m<=e&&L.length<600){if(!cov[m])L.push(m);m=addM(m,1)}return L}
function estado(c){const P=pend(c);if(!P.length)return{k:'verde',t:'Al día',P};const d=Math.floor((new Date(today())-new Date(P[0]+'-01'))/864e5),g=c.gracia??S.cfg.gracia;return d<=g?{k:'amarillo',t:'Pendiente · gracia ('+d+' d)',P}:{k:'rojo',t:'Reclamar ('+d+' d)',P}}
function dl(txt,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}
function modal(h){const d=$('#dlg');d.innerHTML='<div class=mb><button class="x s" aria-label="Cerrar" onclick="cerrar()">✕</button>'+h+'</div>';if(!d.open)d.showModal();d.firstChild.scrollTop=0}
const cerrar=()=>$('#dlg').close(),go=n=>{tab=n;render()};
let ed=false;
const back=id=>ed?fContrato(id):cerrar();
function tog(){ed=!ed;if(!ed&&(tab==1||tab==4))tab=0;if($('#dlg').open)cerrar();render()}
function render(){document.body.classList.toggle('ed',ed);$('#lk').textContent=ed?'🔓 Edición':'🔒 Gestión';$('#t1').hidden=$('#t4').hidden=!ed;[0,1,2,3,4].forEach(i=>$('#t'+i).classList.toggle('on',i==tab));$('#v').innerHTML=[vPanel,vInq,vPag,vInf,vCfg][tab]()}
function libreDesde(p){const f=S.contratos.filter(c=>c.pl==p.id&&c.fin).map(c=>c.fin).sort().pop();return f?' desde '+fd(f):''}
function subida(p){const h=(p.hist||[]).map(x=>x.f).sort().pop();if(!h)return '';const m=Math.round((new Date(today())-new Date(h))/2.63e9);return ' · última subida hace '+m+' m'+(m>=12?' ⚠️':'')}
function vInq(){const L=S.contratos.slice().sort((a,b)=>fechaC(a).localeCompare(fechaC(b))*(S.cfg.orden=='asc'?1:-1));
 return `<div class=bar><button onclick="fContrato('')">+ Nuevo inquilino</button></div>`+(L.map(c=>{const p=plaza(c.pl),fin=c.fin&&c.fin<today(),e=fin?{k:'',t:'Finalizado'}:estado(c);return `<div class="card pl ${e.k}"><b>${esc(c.nom||'Sin nombre')}</b> · Plaza ${esc(p?p.num:'?')} <span class="bd ${e.k}">${e.t}</span><br><small>${fd(c.inicio)} → ${c.fin?fd(c.fin):'vigente'} · paga cada ${c.per||1} mes(es) · 📍 ${esc(c.lugar||'sin lugar')}${c.tel?' · '+esc(c.tel):''}</small><br><button onclick="fContrato('${c.id}')">Abrir ficha</button><button onclick="fPago('${c.id}')">Cobrar</button>${fin?'':`<button class=s onclick="fMsg('${c.id}')">Mensaje</button>`}</div>`}).join('')||'<p>Aún no hay inquilinos. Crea una plaza y pulsa «+ Nuevo inquilino».</p>')}
function vPag(){const L=S.pagos.slice().sort((a,b)=>a.f.localeCompare(b.f)*(S.cfg.orden=='asc'?1:-1));
 return `<div class=bar><button onclick="fElegir()">+ Registrar pago</button></div>`+(L.map(p=>{const c=contr(p.c),pl=c&&plaza(c.pl);return `<div class="card row" onclick="fPago('${p.c}','','${p.id}')"><span>${fd(p.f)} · Plaza ${esc(pl?pl.num:'?')} · ${esc(c?c.nom||'Sin nombre':'?')}<br><small>${esc(p.m)}${(p.meses||[]).length?' · '+p.meses.map(mlabel).join(', '):''}${p.nota?' · '+esc(p.nota):''}</small></span><b>${eur(p.i)}</b></div>`}).join('')||'<p>Aún no hay pagos.</p>')}
function fElegir(){if(!S.contratos.length)return alert('Primero añade un inquilino.');modal(`<h3>¿Quién paga?</h3>${S.contratos.slice().sort((a,b)=>fechaC(a).localeCompare(fechaC(b))).map(c=>`<div class=row onclick="fPago('${c.id}')"><span>${esc(c.nom||'Sin nombre')}</span><small>Plaza ${esc(plaza(c.pl)?.num)}${c.fin&&c.fin<today()?' · finalizado':''}</small></div>`).join('')}<button class=s onclick="cerrar()">Cancelar</button>`)}
let visIds=[];
const so=(a,b)=>a==b?'selected':'';
function mv(id,d){const i=visIds.indexOf(id),o=visIds[i+d];if(i<0||!o)return;const p=S.plazas.find(x=>x.id==id);S.plazas=S.plazas.filter(x=>x.id!=id);const k=S.plazas.findIndex(x=>x.id==o);S.plazas.splice(d>0?k+1:k,0,p);save();render();const e=document.querySelector('[data-id="'+id+'"]');if(e)e.scrollIntoView({block:'nearest'})}
function vPanel(){
 const R=S.plazas.map(p=>{const c=activo(p);return{p,c,e:c?estado(c):null}}),A=R.filter(r=>!r.p.inactiva),I=R.filter(r=>r.p.inactiva);
 const mes=S.pagos.filter(p=>ym(p.f)==ym(today())).reduce((s,p)=>s+p.i,0),n=k=>A.filter(r=>r.e&&r.e.k==k).length;
 const V={act:A,pend:A.filter(r=>r.e&&r.e.k!='verde'),inact:I,todas:R}[flt]||A;visIds=V.map(r=>r.p.id);
 const aviso=(S.plazas.length&&(!S.ultimaCopia||(new Date(today())-new Date(S.ultimaCopia))/864e5>30))?'<div class=warn>Hace más de 30 días que no exportas una copia de seguridad. Abre el modo edición (candado) y ve a «Ajustes».</div>':'';
 return aviso+`<div class=sum><div>Plazas activas<b>${A.length}</b></div><div>Libres<b>${A.filter(r=>!r.c).length}</b></div><div>A reclamar<b>${n('rojo')}</b></div><div>En gracia<b>${n('amarillo')}</b></div><div>Cobrado este mes<b>${eur(mes)}</b></div></div>
 <div class=vis><span>👁 Visibilidad</span><select onchange="flt=this.value;render()"><option value=act ${so(flt,'act')}>Plazas activas (${A.length})</option><option value=pend ${so(flt,'pend')}>Solo pendientes</option><option value=inact ${so(flt,'inact')}>Inactivas (${I.length})</option><option value=todas ${so(flt,'todas')}>Todas (${R.length})</option></select></div>${ed&&V.length>1?'<small>Usa ▲ ▼ para cambiar el orden de las plazas.</small>':''}
 <div class=grid>`+(V.map(({p,c,e},i)=>{const k=p.inactiva?'':e?e.k:'';return `<div class="card pl ${k}${p.inactiva?' ina':''}" data-id="${p.id}">${ed?`<button class="s ic" title="Editar plaza" aria-label="Editar plaza" onclick="fPlaza('${p.id}')">✏️</button><button class="s ic" title="Mover después" aria-label="Mover después" ${i==V.length-1?'disabled':''} onclick="mv('${p.id}',1)">▼</button><button class="s ic" title="Mover antes" aria-label="Mover antes" ${i==0?'disabled':''} onclick="mv('${p.id}',-1)">▲</button>`:''}<b>Plaza ${esc(p.num)}</b> <span class="bd ${k}">${p.inactiva?'Inactiva'+(p.motivo?' · '+esc(p.motivo):''):e?e.t:'Libre'+libreDesde(p)}</span><br>${c?esc(c.nom||'Sin nombre')+'<br><small>📍 '+esc(c.lugar||'sin lugar')+' · paga cada '+(c.per||1)+' mes(es)</small>':''}<br><small>${eur(p.precio)}/mes${subida(p)}</small>${e&&e.P.length?'<br><small>Pendiente: '+e.P.map(mlabel).join(', ')+'</small>':''}<br>${c?`<button onclick="fPago('${c.id}')">Cobrar</button>${e.P.length?`<button class=s onclick="fMsg('${c.id}')">Mensaje</button>`:''}${ed?`<button class=s onclick="fContrato('${c.id}')">Inquilino</button>`:''}`:(ed&&!p.inactiva?`<button onclick="fContrato('','${p.id}')">Asignar inquilino</button>`:'')}</div>`}).join('')||'<p>'+(S.plazas.length?'No hay plazas con esta visibilidad.':'Aún no hay plazas. '+(ed?'Pulsa «+ Nueva plaza» abajo.':'Pulsa el candado de arriba para entrar en modo edición.'))+'</p>')+'</div>'+(ed?'<div class=bar style="margin-top:14px"><button onclick="fPlaza()">+ Nueva plaza</button></div>':'')}
function histHTML(p){p.hist=p.hist||[];if(p.hist.some(h=>!h.id)){p.hist.forEach(h=>h.id=h.id||uid());save()}
 const L=p.hist.slice().sort((a,b)=>a.f.localeCompare(b.f));
 return (L.map(h=>`<div class=row style="cursor:default"><span>${fd(h.f)}: ${eur(h.a)} → ${eur(h.d)}</span><button class="s ic" aria-label="Eliminar fila" onclick="dHist('${p.id}','${h.id}')">🗑️</button></div>`).join('')||'<small>Sin cambios registrados</small>')+`<div class=bar style="margin-top:10px"><label>Fecha del cambio<input type=date id=hf value="${today()}"></label><label>Precio antiguo (€)<input type=number step=0.01 id=ha></label><label>Precio nuevo (€)<input type=number step=0.01 id=hd></label></div><button onclick="aHist('${p.id}')">+ Añadir al histórico</button>`}
function aHist(id){const p=plaza(id),f=$('#hf').value,a=parseFloat($('#ha').value),d=parseFloat($('#hd').value);if(!f||isNaN(a)||isNaN(d))return alert('Indica la fecha, el precio antiguo y el precio nuevo.');p.hist=p.hist||[];p.hist.push({id:uid(),f,a,d});save();$('#hh').innerHTML=histHTML(p);render()}
function dHist(id,hid){if(!confirm('¿Eliminar esta fila del histórico?'))return;const p=plaza(id);p.hist=(p.hist||[]).filter(h=>h.id!=hid);save();$('#hh').innerHTML=histHTML(p);render()}
function fPlaza(id,cid){const p=id?plaza(id):{},cs=id?S.contratos.filter(c=>c.pl==id).sort((a,b)=>fechaC(b).localeCompare(fechaC(a))):[];
 modal(`<h3>${id?'Plaza '+esc(p.num):'Nueva plaza'}</h3><label>Nº o nombre *<input id=pn value="${esc(p.num)}"></label><label>Precio mensual (€) *<input id=pp type=number step=0.01 value="${p.precio??''}"></label><small>Es el precio vigente: se usa en cobros, mensajes e informes. El histórico de precios es independiente y se anota a mano.</small><label>Descripción<input id=pd value="${esc(p.desc)}"></label><label style="display:flex;gap:8px;align-items:center;color:var(--t);margin-top:12px"><input type=checkbox id=pia style="width:auto;margin:0" ${p.inactiva?'checked':''} onchange="$('#pmo').hidden=!this.checked">Plaza inactiva (ya no la alquilo)</label><div id=pmo ${p.inactiva?'':'hidden'}><label>Motivo<select id=pmt>${['','Vendida','La uso yo','Otro motivo'].map(x=>`<option value="${x}" ${p.motivo==x?'selected':''}>${x||'— sin indicar —'}</option>`).join('')}</select></label></div><div class=act><button onclick="gPlaza('${id||''}',0,'${cid||''}')">Guardar</button>${id?'':`<button onclick="gPlaza('',1)">Guardar y añadir inquilino</button>`}${cid?`<button class=s onclick="fContrato('${cid}')">Volver al inquilino</button>`:`<button class=s onclick="cerrar()">Cerrar</button>`}</div>`+(id?`<h4>Histórico de precios</h4><div id=hh>${histHTML(p)}</div><h4>Contratos</h4>${cs.map(c=>`<div class=row onclick="fContrato('${c.id}')"><span>${esc(c.nom||'Sin nombre')}</span><small>${fd(c.inicio)} → ${c.fin?fd(c.fin):'vigente'}</small></div>`).join('')||'<small>Sin contratos</small>'}<button onclick="fContrato('','${id}')">+ Nuevo contrato</button><button class=d onclick="dPlaza('${id}')">Eliminar plaza</button>`:''))}
function gPlaza(id,ir,cid){const n=$('#pn').value.trim(),pr=parseFloat($('#pp').value),ina=$('#pia').checked;if(!n||isNaN(pr))return alert('El nº de plaza y el precio son obligatorios.');let p=id?plaza(id):null;if(ina&&p&&!p.inactiva&&activo(p)&&!confirm('Esta plaza tiene un inquilino vigente. ¿Marcarla como inactiva igualmente?'))return;if(!p){p={id:uid(),hist:[]};S.plazas.push(p)}Object.assign(p,{num:n,precio:pr,desc:$('#pd').value,inactiva:ina,motivo:ina?$('#pmt').value:''});save();render();if(ir)fContrato('',p.id);else if(cid)fContrato(cid);else cerrar()}
function dPlaza(id){if(S.contratos.some(c=>c.pl==id))return alert('La plaza tiene contratos. Elimínalos antes.');if(confirm('¿Eliminar la plaza?')){S.plazas=S.plazas.filter(p=>p.id!=id);save();cerrar();render()}}
const sel=(id,v)=>`<select id=${id}>${[['no','No'],['si','Sí'],['nc','No consta'],['na','No aplica']].map(o=>`<option value=${o[0]} ${v==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`;
function chips(c){const cov=cubiertos(c),t=ym(today());let a=ini(c),z=c.fin?ym(c.fin):addM(t,5);Object.keys(cov).forEach(m=>{if(m>z)z=m});const o=[];while(a<=z&&o.length<300){const k=cov[a]?(cov[a]=='libre'?'lb':'pg'):(a<=t?'pe':'fu');o.push(`<span class=${k} onclick="fMes('${c.id}','${a}')">${mlabel(a)}${k=='lb'?' 🎁':''}</span>`);a=addM(a,1)}return `<div class=ch>${o.join('')}</div><small>Verde: pagado · Rojo: pendiente · Morado: gratis · Gris: futuro. Toca un mes para cambiarlo.</small>`}
function fContrato(id,pl){if(!S.plazas.length)return alert('Crea primero una plaza.');const c=id?contr(id):{pl},l=c.ll||{},lug=[...new Set([...S.cfg.lugares,c.lugar].filter(Boolean))];
 const top=id?`<h3>${esc(c.nom||'Inquilino')} · Plaza ${esc(plaza(c.pl)?.num)}</h3><button onclick="fPago('${id}')">Registrar pago</button><button class=s onclick="fMsg('${id}')">Copiar mensaje</button><button class=s onclick="fPlaza('${c.pl}','${id}')">Plaza y precios</button><button class=d onclick="fBaja('${id}')">Dar de baja</button><h4>Meses</h4>${chips(c)}<h4>Pagos</h4>${pagosC(c).sort((a,b)=>((a.meses||[])[0]||a.f).localeCompare((b.meses||[])[0]||b.f)*(S.cfg.orden=='asc'?1:-1)).map(p=>`<div class=row onclick="fPago('${id}','','${p.id}')"><span>${fd(p.f)} · ${esc(p.m)}${p.meses&&p.meses.length?' · '+p.meses.map(mlabel).join(', '):''}${p.nota?' · '+esc(p.nota):''}</span><b>${eur(p.i)}</b></div>`).join('')||'<small>Sin pagos</small>'}<h4>Datos del inquilino y contrato</h4>`:'<h3>Nuevo inquilino</h3>';
 modal(top+`<label>Plaza *<select id=cpl>${S.plazas.slice().sort((a,b)=>String(a.num).localeCompare(String(b.num),'es',{numeric:true})).map(p=>`<option value=${p.id} ${c.pl==p.id?'selected':''}>Plaza ${esc(p.num)}${p.inactiva?' (inactiva)':''}</option>`).join('')}</select></label>
 <label>Nombre<input id=cn value="${esc(c.nom)}"></label><label>Teléfono<input id=ct value="${esc(c.tel)}"></label><label>Matrícula / notas del inquilino<input id=cm value="${esc(c.mat)}"></label>
 <label>Inicio del contrato<input type=date id=ci value="${c.inicio||''}"></label><label>Fin / baja<input type=date id=cf value="${c.fin||''}"></label>
 <label>Paga cada<select id=cp onchange="$('#cpo').hidden=this.value!='otro'">${[1,2,3,6].map(n=>`<option value=${n} ${(c.per||1)==n?'selected':''}>${n} mes(es)</option>`).join('')}<option value=otro ${[1,2,3,6].includes(c.per||1)?'':'selected'}>Otro…</option></select><input id=cpo type=number min=1 step=1 placeholder="Nº de meses" value="${[1,2,3,6].includes(c.per||1)?'':c.per}" ${[1,2,3,6].includes(c.per||1)?'hidden':''} style="margin-top:6px"></label>
 <label>Lugar de cobro<select id=cl><option value="">—</option>${lug.map(x=>`<option ${c.lugar==x?'selected':''}>${esc(x)}</option>`).join('')}</select></label>
 <label>Periodo de gracia (días; vacío = ${S.cfg.gracia})<input id=cg type=number value="${c.gracia??''}"></label>
 <h4>Mensaje de aviso</h4><label>Plantilla de este inquilino (vacío = la general; usa {nombre} {plaza} {meses} {importe})<textarea id=cx rows=3>${esc(c.plantilla)}</textarea></label>
 <h4>Mando, llaves y fianza</h4><label>Mando (¿se ha entregado?)${sel('k1',l.mando)}</label><label>Fianza del mando (€) — solo si hay mando<input id=k1f type=number step=0.01 value="${l.mandoF||''}"></label><label>Llave de vehículos${sel('k2',l.veh)}</label><label>Llave peatonal${sel('k3',l.pea)}</label>
 <label>Fianza general de la plaza / trastero (€)<input id=k4 type=number step=0.01 value="${l.fianza||''}"></label><label>Notas<textarea id=cz rows=2>${esc(c.notas)}</textarea></label>
 <div class=act><button onclick="gContrato('${id||''}')">Guardar</button><button class=s onclick="cerrar()">Cerrar</button>${id?`<button class=d onclick="dContr('${id}')">Eliminar</button>`:''}</div>`)}
function gContrato(id){let c=id?contr(id):null;if(!c){c={id:uid(),libres:[]};S.contratos.push(c)}const g=$('#cg').value;Object.assign(c,{pl:$('#cpl').value,nom:$('#cn').value.trim(),tel:$('#ct').value.trim(),mat:$('#cm').value.trim(),inicio:$('#ci').value,fin:$('#cf').value,per:$('#cp').value=='otro'?Math.max(1,parseInt($('#cpo').value)||1):+$('#cp').value,lugar:$('#cl').value,gracia:g===''?undefined:+g,plantilla:$('#cx').value.trim(),notas:$('#cz').value,ll:{mando:$('#k1').value,mandoF:$('#k1f').value,veh:$('#k2').value,pea:$('#k3').value,fianza:$('#k4').value}});save();render();fContrato(c.id)}
function dContr(id){if(confirm('¿Eliminar el contrato y todos sus pagos?')){S.pagos=S.pagos.filter(p=>p.c!=id);S.contratos=S.contratos.filter(c=>c.id!=id);save();cerrar();render()}}
function fMes(cid,m){const v=cubiertos(contr(cid))[m];modal(`<h3>${mlabel(m)}</h3>`+(v=='libre'?`<p>Mes marcado como gratis.</p><button onclick="mm('${cid}','${m}','nolibre')">Quitar mes gratis</button>`:v?`<p>Mes pagado.</p><button class=d onclick="mm('${cid}','${m}','quitar')">Quitar este mes del pago</button><button class=s onclick="fPago('${cid}','','${v}')">Editar el pago</button><br><small>El importe del pago no cambia: edítalo si hace falta.</small>`:`<button onclick="fPago('${cid}','${m}')">Registrar pago desde aquí</button><button class=s onclick="mm('${cid}','${m}','libre')">Marcar gratis</button>`)+`<br><button class=s onclick="fContrato('${cid}')">Volver</button>`)}
function mm(cid,m,a){const c=contr(cid);c.libres=c.libres||[];if(a=='libre')c.libres.push(m);if(a=='nolibre')c.libres=c.libres.filter(x=>x!=m);if(a=='quitar')S.pagos.forEach(p=>{if(p.c==cid)p.meses=(p.meses||[]).filter(x=>x!=m)});save();render();fContrato(cid)}
function mesesPago(cid,pid,sm,sel){const c=contr(cid),p=pid?S.pagos.find(x=>x.id==pid):null,cov=cubiertos(c),f=($('#pf')&&$('#pf').value)||(p?p.f:today()),t=ym(today());
 let a=addM(ym(f),-2),z=addM(ym(f),24),pre=sel||(p?(p.meses||[]).slice():null);const P0=pend(c)[0];
 if(!p){if(sm&&sm<a)a=sm;else if(!sm&&P0&&P0<a&&ym(f)>=t)a=P0}
 if(pre)pre.forEach(m=>{if(m<a)a=m;if(m>z)z=m});
 const L=[];for(let m=a;m<=z&&L.length<400;m=addM(m,1))L.push(m);
 if(!pre){pre=[];const d=[sm||'',c.inicio?ym(c.inicio):''].sort().pop();L.forEach(m=>{if(m>=d&&!cov[m]&&pre.length<(c.per||1))pre.push(m)})}
 return L.map(m=>{const oc=cov[m]&&!pre.includes(m);return `<label${oc?' class=fu':''}><input type=checkbox value="${m}" ${pre.includes(m)?'checked':''} ${oc?'disabled':''} onchange="$('#mc').dataset.t=1;calcI('${cid}')">${mlabel(m)}${oc?' ✓':''}</label>`}).join('')}
function mesesUpd(cid,pid){const b=$('#mc');if(!$('#pf').value)return;const sel=(pid||b.dataset.t)?[...b.querySelectorAll('input:checked')].map(x=>x.value):null;b.innerHTML=mesesPago(cid,pid,b.dataset.sm||'',sel);calcI(cid)}
function fPago(cid,sm,pid){const c=contr(cid),p=pid?S.pagos.find(x=>x.id==pid):null;
 modal(`<h3>${p?'Editar pago':'Registrar pago'} · Plaza ${esc(plaza(c.pl).num)}</h3><label>Fecha de cobro<input type=date id=pf value="${p?p.f:today()}" onchange="mesesUpd('${cid}','${pid||''}')"></label><label>Método<select id=pm>${['Efectivo','Bizum','Transferencia'].map(x=>`<option ${p&&p.m==x?'selected':''}>${x}</option>`).join('')}</select></label><label>Meses que cubre (desde 2 meses antes de la fecha de cobro hasta 24 después)</label><div class=ch id=mc data-sm="${sm||''}">${mesesPago(cid,pid,sm,null)}</div><label>Importe (€)<input id=pi type=number step=0.01 value="${p?p.i:''}" ${p?'data-m=1':''} oninput="this.dataset.m=1"></label><label>Nota<input id=pn2 value="${esc(p&&p.nota)}"></label><div class=act><button onclick="gPago('${cid}','${pid||''}')">Guardar</button>${p?`<button class=d onclick="dPago('${pid}')">Eliminar</button>`:''}<button class=s onclick="back('${cid}')">Cancelar</button></div>`);if(!p)calcI(cid)}
function calcI(cid){const i=$('#pi');if(i.dataset.m)return;i.value=(plaza(contr(cid).pl).precio*document.querySelectorAll('.ch input:checked').length).toFixed(2)}
function gPago(cid,pid){const meses=[...document.querySelectorAll('.ch input:checked')].map(x=>x.value).sort(),i=parseFloat($('#pi').value),f=$('#pf').value;if(isNaN(i)||!f)return alert('La fecha y el importe son obligatorios.');let p=pid?S.pagos.find(x=>x.id==pid):null;if(!p){p={id:uid(),c:cid};S.pagos.push(p)}Object.assign(p,{f,i,m:$('#pm').value,meses,nota:$('#pn2').value});save();render();back(cid)}
function dPago(pid){const p=S.pagos.find(x=>x.id==pid);if(confirm('¿Eliminar este pago?')){S.pagos=S.pagos.filter(x=>x.id!=pid);save();render();back(p.c)}}
function fMsg(cid){const c=contr(cid),pl=plaza(c.pl),per=c.per||1,cov=cubiertos(c),M=[];let x=pend(c)[0]||ym(today()),g=0;while(M.length<per&&g++<600){if(!cov[x])M.push(x);x=addM(x,1)}
 const V={nombre:c.nom||'',plaza:pl.num,meses:M.map(mlabel).join(', ')||'—',importe:eur(pl.precio*per)};
 const t=(c.plantilla||S.cfg.plantilla).replace(/\{(\w+)\}/g,(m,k)=>k in V?V[k]:m);modal(`<h3>Mensaje para ${esc(c.nom||'inquilino')}</h3><textarea id=mt rows=6>${esc(t)}</textarea><div class=act><button onclick="cp(this)">Copiar</button><button class=s onclick="cerrar()">Cerrar</button></div>`)}
async function cp(b){const t=$('#mt');try{await navigator.clipboard.writeText(t.value)}catch(e){t.select();document.execCommand('copy')}b.textContent='✓ Copiado'}
function calcRef(c,s){let r=0;const sm=ym(s),[y,mo,d]=s.split('-').map(Number),dm=new Date(y,mo,0).getDate();pagosC(c).filter(p=>p.i>0&&(p.meses||[]).length).forEach(p=>{const x=p.i/p.meses.length;p.meses.forEach(m=>{if(m>sm)r+=x;else if(m==sm&&S.cfg.modo=='dias')r+=x*(dm-d)/dm})});return Math.round(r*100)/100}
function fBaja(cid){modal(`<h3>Dar de baja y liquidar</h3><label>Fecha de salida<input type=date id=bs value="${today()}" onchange="calcB('${cid}')"></label><div id=bi></div><label>Importe a devolver (€)<input id=br type=number step=0.01></label><div class=act><button class=d onclick="gBaja('${cid}')">Confirmar baja</button><button class=s onclick="fContrato('${cid}')">Cancelar</button></div>`);calcB(cid)}
function calcB(cid){const c=contr(cid),s=$('#bs').value;if(!s)return;const r=calcRef(c,s),l=c.ll||{},L=[];if(l.mando=='si')L.push('Mando'+(l.mandoF?' (fianza '+eur(l.mandoF)+')':''));if(l.veh=='si')L.push('Llave de vehículos');if(l.pea=='si')L.push('Llave peatonal');if([l.mando,l.veh,l.pea].includes('nc'))L.push('⚠️ hay elementos «No consta»: revísalos');
 $('#br').value=r.toFixed(2);$('#bi').innerHTML=`<p>Cobrado y no disfrutado (${S.cfg.modo=='dias'?'por días reales':'meses completos'}): <b>${eur(r)}</b></p><p><b>Recuperar:</b> ${L.join(', ')||'nada anotado'}</p>${+l.fianza?`<p>Fianza general a devolver: ${eur(l.fianza)} (no incluida arriba)</p>`:''}`}
function gBaja(cid){const c=contr(cid),s=$('#bs').value,r=parseFloat($('#br').value)||0;if(!s)return;c.fin=s;if(r>0)S.pagos.push({id:uid(),c:cid,f:s,i:-r,m:'Efectivo',meses:[],nota:'Devolución por baja'});save();cerrar();render()}
function movs(){const L=[];S.pagos.forEach(p=>{const c=contr(p.c),pl=c&&plaza(c.pl);if(!pl||(F.pl&&F.pl!=pl.id)||(F.c&&F.c!=c.id)||(F.m&&p.m!=F.m))return;if(F.b=='cobro'||p.i<0||!(p.meses||[]).length)L.push({f:p.f,pl,c,m:p.m,i:p.i,meses:p.meses});else p.meses.forEach(x=>L.push({f:x+'-01',dev:1,pl,c,m:p.m,i:p.i/p.meses.length,meses:[x]}))});return L.filter(x=>{const k=x.dev?x.f.slice(0,7):x.f,lo=x.dev?F.d.slice(0,7):F.d,hi=x.dev?F.h.slice(0,7):F.h;return(!lo||k>=lo)&&(!hi||k<=hi)}).sort((a,b)=>a.f.localeCompare(b.f))}
const tabla=(L,fn,t,lb)=>{const o={};L.forEach(x=>{const k=fn(x);o[k]=(o[k]||0)+x.i});return `<h4>${t}</h4><table>${Object.keys(o).sort((a,b)=>a.localeCompare(b,'es',{numeric:true})).map(k=>`<tr><td>${esc(lb?lb(k):k)}</td><td>${eur(o[k])}</td></tr>`).join('')||'<tr><td>Sin datos</td><td></td></tr>'}</table>`};
function fPl(v){F.pl=v;const c=F.c&&contr(F.c);if(c&&v&&c.pl!=v)F.c='';render()}
function fCo(v){F.c=v;const c=v&&contr(v);if(c)F.pl=c.pl;render()}
function vInf(){const L=movs(),hu=S.contratos.filter(c=>pend(c).length).map(c=>`<div>Plaza ${esc(plaza(c.pl)?.num)} · ${esc(c.nom||'Sin nombre')}: ${pend(c).map(mlabel).join(', ')}</div>`).join('');
 const CS=S.contratos.filter(c=>!F.pl||c.pl==F.pl).sort((a,b)=>fechaC(a).localeCompare(fechaC(b))),hint=F.b=='dev'?'Cada pago se reparte a partes iguales entre los meses que cubre y cuenta en cada uno. Desde/Hasta se aplican por meses.':'Cada pago cuenta entero en la fecha en que lo cobraste.';
 return `<div class=card><div class=bar><select onchange="fPl(this.value)"><option value="">Todas las plazas</option>${S.plazas.map(p=>`<option value=${p.id} ${F.pl==p.id?'selected':''}>Plaza ${esc(p.num)}${p.inactiva?' (inactiva)':''}</option>`).join('')}</select><select onchange="fCo(this.value)"><option value="">Todos los inquilinos${F.pl?' de la plaza':''}</option>${CS.map(c=>`<option value=${c.id} ${F.c==c.id?'selected':''}>${esc(c.nom||'Sin nombre')}${F.pl?'':' (plaza '+esc(plaza(c.pl)?.num)+')'}</option>`).join('')}</select><select onchange="F.m=this.value;render()"><option value="">Todos los métodos</option>${['Efectivo','Bizum','Transferencia'].map(x=>`<option ${F.m==x?'selected':''}>${x}</option>`).join('')}</select></div><div class=bar><label>Desde<input type=date value="${F.d}" onchange="F.d=this.value;render()"></label><label>Hasta<input type=date value="${F.h}" onchange="F.h=this.value;render()"></label><label>Contar los importes por<select onchange="F.b=this.value;render()"><option value=cobro>Fecha de cobro</option><option value=dev ${F.b=='dev'?'selected':''}>Mes que cubre</option></select></label></div><small>${hint}</small>
 <h3>Total: ${eur(L.reduce((s,x)=>s+x.i,0))}</h3><small>Las devoluciones restan.</small>${tabla(L,x=>'Plaza '+x.pl.num,'Por plaza')}${tabla(L,x=>x.c.nom||'Sin nombre','Por inquilino')}${tabla(L,x=>x.f.slice(0,4),'Por año')}${tabla(L,x=>x.f.slice(0,7),'Por mes',mlabel)}${tabla(L,x=>x.m,'Por método')}<button onclick="csv()">Exportar CSV</button><button class=s onclick="print()">Imprimir</button></div>
 <div class=card><h4>Meses sin cobrar (huecos)</h4>${hu||'<small>Ninguno</small>'}</div>`}
function csv(){const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';dl('\ufeff'+['Fecha;Plaza;Inquilino;Método;Meses;Importe',...movs().map(x=>[x.dev?mlabel(x.f.slice(0,7)):fd(x.f),x.pl.num,x.c.nom||'',x.m,(x.meses||[]).join(' '),String(x.i).replace('.',',')].map(q).join(';'))].join('\n'),'informe_'+today()+'.csv','text/csv')}
function vCfg(){const c=S.cfg;return `<details class=card><summary><b>⚙️ Ajustes generales</b></summary><small>Fechas, gracia, plantilla, mando y llaves de cada inquilino están en su ficha (pestaña Inquilinos).</small><label>Periodo de gracia por defecto (días)<input id=sg type=number value="${c.gracia}"></label><label>Orden de las listas de Inquilinos y Pagos<select id=so><option value=asc ${c.orden=='asc'?'selected':''}>Más antiguos primero</option><option value=desc ${c.orden=='desc'?'selected':''}>Más recientes primero</option></select></label><label>Cálculo de devoluciones<select id=sm><option value=dias ${c.modo=='dias'?'selected':''}>Por días reales</option><option value=meses ${c.modo=='meses'?'selected':''}>Solo meses completos</option></select></label><label>Lugares de cobro (uno por línea)<textarea id=sl rows=4>${esc(c.lugares.join('\n'))}</textarea></label><label>Plantilla general de mensaje<textarea id=sp rows=3>${esc(c.plantilla)}</textarea></label><button onclick="gCfg()">Guardar ajustes</button></details>
 <div class=card><h3>Copias de seguridad</h3><small>Última copia: ${fd(S.ultimaCopia)}</small><br><button onclick="exp()">Exportar copia (JSON)</button><label>Restaurar copia<input type=file accept=.json onchange="imp(this)"></label><button class=d onclick="fBorrar()">Borrar todos los datos</button></div>`}
function gCfg(){S.cfg.gracia=+$('#sg').value||0;S.cfg.modo=$('#sm').value;S.cfg.orden=$('#so').value;S.cfg.lugares=$('#sl').value.split('\n').map(x=>x.trim()).filter(Boolean);S.cfg.plantilla=$('#sp').value;save();render()}
function exp(){S.ultimaCopia=today();save();dl(JSON.stringify(S,null,1),'garajes_'+today()+'.json','application/json');if(tab==4)render()}
function imp(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(![d.plazas,d.contratos,d.pagos].every(Array.isArray))throw 0;if(confirm(`Copia con ${d.plazas.length} plazas, ${d.contratos.length} contratos y ${d.pagos.length} pagos. Sustituirá los datos actuales. ¿Continuar?`)){localStorage.setItem(K,JSON.stringify(d));S=load();migra();render()}}catch(e){alert('El archivo no es una copia válida.')}};r.readAsText(f);i.value=''}
function fBorrar(){modal(`<h3>⚠️ Borrar todos los datos</h3><p>Se eliminarán plazas, contratos y pagos guardados en este navegador. No se puede deshacer.</p><button onclick="exp()">Descargar copia ahora</button><label>Escribe BORRAR para confirmar<input oninput="$('#bd').disabled=this.value!='BORRAR'"></label><button class=d id=bd disabled onclick="localStorage.removeItem(K);S=defaults();cerrar();render()">Borrar todo</button><button class=s onclick="cerrar()">Cancelar</button>`)}
render();
</script></body></html>
