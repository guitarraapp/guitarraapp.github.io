<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15171d">
<title>Tareas del hogar v2</title>
<style>
:root{--bg:#15171d;--panel:#1e2128;--line:#32363f;--amber:#ffb224;--ok:#6fd68e;--bad:#ff5a4d;--tx:#f4f2ec;--dim:#9a9ca6}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);display:flex;justify-content:center}
#app{width:100%;max-width:560px;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 14px 0}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;flex:none;font-weight:700;color:var(--amber)}
main{flex:1;min-height:0;overflow-y:auto;padding-bottom:12px}
h3{font-size:.95rem;margin:14px 0 6px}
.d{font-size:.82rem;color:var(--dim);line-height:1.4;margin:4px 0}
select,input,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--tx);font-size:16px;padding:0 10px;height:40px;max-width:100%}
textarea{width:100%;height:70px;padding:8px;margin:6px 0}
input[type=number]{width:70px;text-align:center}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--amber)}
.btn,.chip{min-height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--tx);font-size:.95rem;display:inline-flex;align-items:center}
.chip.sel{background:var(--amber);color:#111;border-color:var(--amber);font-weight:700}
.row{display:flex;align-items:center;gap:8px;min-height:44px;flex-wrap:wrap;font-size:.92rem}
.r{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.rn{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.rn b{font-size:1.02rem}.rn span{font-size:.8rem;color:var(--dim)}
.bad{color:var(--bad)}
.ck{width:48px;height:48px;border-radius:50%;border:2px solid var(--ok);background:none;color:var(--ok);font-size:1.4rem;font-weight:800;flex:none}
footer{flex:none;padding-bottom:calc(6px + env(safe-area-inset-bottom))}
nav{display:flex}nav button{flex:1;height:46px;background:none;border:0;border-top:3px solid transparent;color:var(--dim);font-size:1rem;font-weight:600}
nav .sel{color:var(--tx);border-color:var(--amber)}
#sh{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sc{width:100%;max-width:560px;max-height:88dvh;overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
.sc>.btn,.sc .row .btn{margin:4px 6px 4px 0}
#tt{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#2a2e37;border:1px solid var(--line);border-radius:14px;padding:6px 8px 6px 14px;display:flex;align-items:center;gap:10px;z-index:6;white-space:nowrap}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<div id="app">
<header><span>Tareas del hogar</span></header>
<div id="hc" class="row" style="flex:none"></div>
<main id="mn"></main>
<footer><nav><button data-v="0" class="sel">Hoy</button><button data-v="1">Tareas</button><button data-v="2">Historial</button><button data-v="3">Ajustes</button></nav></footer>
</div>
<div id="sh" hidden><div class="sc"></div></div>
<div id="tt" hidden></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={homes:[{id:'h1',n:'Casa principal'},{id:'h2',n:'Segunda casa'}],people:[{id:'p1',n:'Yo'}],tasks:[],log:[],h:'h1',me:'p1'},V=0;
try{Object.assign(S,JSON.parse(localStorage.getItem('hogar1')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('hogar1',JSON.stringify(S))}catch(e){}};

/* ---------- fechas y cálculo de "cuándo toca" ---------- */
const dn=s=>{const[y,m,d]=s.split('-').map(Number);return Math.floor(Date.UTC(y,m-1,d)/864e5)};
const ds=n=>new Date(n*864e5).toISOString().slice(0,10);
const tk=()=>{const d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)};
const wd=n=>((n+3)%7+7)%7,DN=['L','M','X','J','V','S','D'];
const pn=id=>(S.people.find(p=>p.id===id)||{n:'?'}).n;
const lg=(t,h)=>S.log.filter(l=>l.t===t.id&&l.h===h).sort((a,b)=>b.d.localeCompare(a.d));
function due(t,h,T){const L=lg(t,h)[0],ld=L?dn(L.d):null;
  if(t.m==='s')return ld==null?T:ld+t.e;
  if(t.m==='f'&&t.w.length){let p=null;for(let i=0;i<7;i++)if(t.w.includes(wd(T-i))){p=T-i;break}
    if(p!=null&&(ld==null?p===T:ld<p))return p;
    for(let i=1;i<=7;i++)if(t.w.includes(wd(T+i)))return T+i}
  return null}
const ago=n=>n<=0?'hoy':n===1?'ayer':'hace '+n+' d';
const when=(L,T)=>L?ago(T-dn(L.d))+' · '+esc(pn(L.w)):'nunca hecha';
const pl=(n,a,b)=>n+' '+(n===1?a:b);
const frq=t=>t.m==='l'?'Al llegar':t.m==='x'?'Al salir':t.m==='f'?'Días: '+t.w.map(d=>DN[d]).join(' '):
  'Cada '+(t.e%365===0?pl(t.e/365,'año','años'):t.e%30===0?pl(t.e/30,'mes','meses'):t.e%7===0?pl(t.e/7,'semana','semanas'):pl(t.e,'día','días'));
const dl=(d,T)=>d==null?'':d<T?`<b class="bad">atrasada ${pl(T-d,'día','días')}</b>`:d===T?'toca hoy':d===T+1?'mañana':'en '+(d-T)+' d';

/* ---------- pantallas ---------- */
const row=(t,T,pre)=>`<div class="r"><div class="rn" data-t="${t.id}"><b>${esc(t.n)}</b><span>${pre}${when(lg(t,S.h)[0],T)}</span></div><button class="ck" data-ok="${t.id}" aria-label="Marcar hecha">✓</button></div>`;
const mine=()=>S.tasks.filter(t=>t.hs.includes(S.h));
function hoy(){const T=tk(),G=[[],[],[],[]],N=['Atrasadas','Hoy','Mañana','Pasado mañana'];let o='';
  mine().forEach(t=>{const d=due(t,S.h,T);if(d==null)return;const i=d<T?0:d>T+2?-1:d-T+1;if(i>=0)G[i].push([t,d])});
  G.forEach((g,i)=>{if(!g.length){if(i>0&&mine().length)o+=`<h3>${N[i]}</h3><p class="d">Nada.</p>`;return}g.sort((a,b)=>a[1]-b[1]);
    o+=`<h3>${N[i]}</h3>`+g.map(([t,d])=>row(t,T,i===0?`<b class="bad">${pl(T-d,'día','días')} de retraso</b> · `:'')).join('')});
  [['l','Al llegar'],['x','Al salir']].forEach(([m,n])=>{const l=mine().filter(t=>t.m===m);if(l.length)o+=`<h3>${n}</h3>`+l.map(t=>row(t,T,'')).join('')});
  if(!mine().length)o='<p class="d">Este domicilio no tiene tareas todavía.</p><div class="row"><button class="btn" id="tp">Añadir desde plantilla</button><button class="btn" id="nt">＋ Nueva tarea</button></div>';
  return o}
function lista(){const T=tk(),l=mine().map(t=>[t,due(t,S.h,T)]).sort((a,b)=>(a[1]==null)-(b[1]==null)||a[1]-b[1]);
  return `<div class="row"><button class="btn" id="nt">＋ Nueva tarea</button><button class="btn" id="tp">Desde plantilla</button></div>`+
    l.map(([t,d])=>row(t,T,frq(t)+(d!=null?' · '+dl(d,T):'')+' · ')).join('')}
function hist(){const T=tk(),q=(window.hq||'').toLowerCase(),ts=mine().filter(t=>t.n.toLowerCase().includes(q));
  let o=`<input id="hq" placeholder="Buscar tarea…" value="${esc(window.hq||'')}" style="width:100%;margin:8px 0"><h3>Última vez de cada tarea</h3>`+
    ts.map(t=>{const L=lg(t,S.h)[0];return `<div class="r"><div class="rn" data-t="${t.id}"><b>${esc(t.n)}</b><span>${L?L.d+' ('+ago(T-dn(L.d))+') · '+esc(pn(L.w)):'nunca hecha'}</span></div></div>`}).join('');
  const ids=new Set(ts.map(t=>t.id)),lo=S.log.filter(l=>l.h===S.h&&ids.has(l.t)).sort((a,b)=>b.d.localeCompare(a.d)).slice(0,60);
  return o+'<h3>Registros recientes</h3>'+(lo.map(l=>`<div class="row">${l.d} · ${esc((S.tasks.find(t=>t.id===l.t)||{n:'?'}).n)} · ${esc(pn(l.w))}</div>`).join('')||'<p class="d">Sin registros todavía.</p>')}
function ajustes(){return `<h3>Yo soy</h3><div class="row"><select id="me">${S.people.map(p=>`<option value="${p.id}"${p.id===S.me?' selected':''}>${esc(p.n)}</option>`).join('')}</select></div>
<h3>Personas</h3>${S.people.map(p=>`<div class="row"><input data-pn="${p.id}" value="${esc(p.n)}"></div>`).join('')}<button class="btn" id="ap">＋ Persona</button>
<h3>Domicilios</h3>${S.homes.map(h=>`<div class="row"><input data-hn="${h.id}" value="${esc(h.n)}"></div>`).join('')}<button class="btn" id="ah">＋ Domicilio</button>
<h3>Copia de seguridad</h3><div class="row"><button class="btn" id="ex">Exportar</button><label class="btn">Importar<input type="file" id="im" accept=".json" hidden></label></div>
<p class="d">Los datos se guardan solo en este navegador. Exporta de vez en cuando una copia.</p>`}
const hc=()=>$('#hc').innerHTML=S.homes.map(h=>`<button class="chip${h.id===S.h?' sel':''}" data-home="${h.id}">${esc(h.n)}</button>`).join('');
function render(){hc();
  $('#mn').innerHTML=[hoy,lista,hist,ajustes][V]();
  $$('nav button').forEach(b=>b.classList.toggle('sel',+b.dataset.v===V))}

/* ---------- registro ---------- */
let tmr;
function toast(msg,undo){const e=$('#tt');e.hidden=false;e.innerHTML=`<span>${msg}</span>${undo?'<button class="btn" id="un">Deshacer</button>':''}`;
  if(undo)$('#un').onclick=()=>{S.log=S.log.filter(l=>l.i!==undo);save();e.hidden=true;render()};clearTimeout(tmr);tmr=setTimeout(()=>e.hidden=true,5000)}
function addLog(t,d,w){const l={i:uid(),t,h:S.h,d,w};S.log.push(l);save();render();return l}
function sheet(h){const s=$('#sh');s.hidden=false;s.querySelector('.sc').innerHTML=h;s.onclick=e=>{if(e.target===s)s.hidden=true}}
const close=()=>$('#sh').hidden=true;
function det(id){const t=S.tasks.find(x=>x.id===id),L=lg(t,S.h);
  sheet(`<h3>${esc(t.n)}</h3><p class="d">${frq(t)}</p>${t.note?`<p class="d">${esc(t.note)}</p>`:''}
<div class="row"><input type="date" id="dd" value="${ds(tk())}"><select id="dw">${S.people.map(p=>`<option value="${p.id}"${p.id===S.me?' selected':''}>${esc(p.n)}</option>`).join('')}</select></div>
<button class="btn" id="rg">Registrar como hecha</button><button class="btn" id="ed">Editar tarea</button>
<h3>Historial</h3>${L.slice(0,10).map(l=>`<div class="row">${l.d} · ${esc(pn(l.w))}<button class="btn" data-del="${l.i}" aria-label="Borrar registro">✕</button></div>`).join('')||'<p class="d">Sin registros</p>'}`);
  $('#rg').onclick=()=>{addLog(id,$('#dd').value||ds(tk()),$('#dw').value);close()};
  $('#ed').onclick=()=>edit(id);
  $$('[data-del]').forEach(b=>b.onclick=()=>{S.log=S.log.filter(l=>l.i!==b.dataset.del);save();render();det(id)})}
function edit(id){const t=id?S.tasks.find(x=>x.id===id):{n:'',m:'s',e:14,w:[],hs:[S.h]},u=t.e%365===0?365:t.e%30===0?30:t.e%7===0?7:1;
  sheet(`<h3>${id?'Editar':'Nueva'} tarea</h3><input id="en" value="${esc(t.n)}" placeholder="Nombre de la tarea" style="width:100%">
<div class="row"><select id="em">${[['s','Cada cierto tiempo'],['f','Días fijos'],['l','Al llegar'],['x','Al salir']].map(([v,n])=>`<option value="${v}"${v===t.m?' selected':''}>${n}</option>`).join('')}</select></div>
<div class="row" id="fs"><span>Cada</span><input type="number" id="en2" min="1" value="${t.e/u}"><select id="eu">${[[1,'días'],[7,'semanas'],[30,'meses'],[365,'años']].map(([v,n])=>`<option value="${v}"${v===u?' selected':''}>${n}</option>`).join('')}</select></div>
<div class="row" id="fw">${DN.map((d,i)=>`<button class="chip${t.w.includes(i)?' sel':''}" data-wd="${i}">${d}</button>`).join('')}</div>
<div class="row">${S.homes.map(h=>`<label class="row"><input type="checkbox" data-hh="${h.id}"${t.hs.includes(h.id)?' checked':''}>${esc(h.n)}</label>`).join('')}</div>
${id?'':'<div class="row"><span>Última vez que se hizo</span><input type="date" id="ela"></div>'}
<textarea id="eno" placeholder="Notas (producto, temperatura…)">${esc(t.note||'')}</textarea>
<button class="btn" id="sv">Guardar</button>${id?'<button class="btn" id="dt">Eliminar</button>':''}`);
  const sy=()=>{const m=$('#em').value;$('#fs').hidden=m!=='s';$('#fw').hidden=m!=='f'};sy();$('#em').onchange=sy;
  $$('[data-wd]').forEach(b=>b.onclick=()=>b.classList.toggle('sel'));
  $('#sv').onclick=()=>{const n=$('#en').value.trim(),hs=$$('[data-hh]').filter(c=>c.checked).map(c=>c.dataset.hh);
    if(!n||!hs.length){alert('Pon un nombre y elige al menos un domicilio');return}
    const o={id:id||uid(),n,m:$('#em').value,e:Math.max(1,+$('#en2').value||1)*+$('#eu').value,w:$$('[data-wd]').filter(b=>b.classList.contains('sel')).map(b=>+b.dataset.wd),hs,note:$('#eno').value.trim()};
    if(id)S.tasks[S.tasks.findIndex(x=>x.id===id)]=o;else{S.tasks.push(o);const la=$('#ela');if(la&&la.value&&hs.includes(S.h))S.log.push({i:uid(),t:o.id,h:S.h,d:la.value,w:S.me})}save();render();close()};
  if(id)$('#dt').onclick=()=>{if(confirm('¿Eliminar la tarea y su historial?')){S.tasks=S.tasks.filter(x=>x.id!==id);S.log=S.log.filter(l=>l.t!==id);save();render();close()}}}
const TP=[['Cambiar sábanas','s',14],['Cambiar toallas','s',7],['Limpiar baños','s',7],['Aspirar','s',7],['Fregar suelos','s',7],['Quitar el polvo','s',7],['Limpiar nevera','s',30],['Limpiar cristales','s',30],['Limpiar horno','s',60],['Lavar cortinas','s',90],['Cambiar ropa de temporada','s',182],['Sacar la basura','f',[1,4]],['Abrir el agua','l'],['Cerrar el agua','x']];
function plantilla(){sheet(`<h3>Plantilla de tareas</h3><p class="d">Marca las que quieras añadir a este domicilio. Luego puedes ajustar la frecuencia.</p>`+
  TP.map((x,i)=>`<label class="row"><input type="checkbox" data-tp="${i}">${x[0]} <span class="d">${x[1]==='s'?'cada '+x[2]+' d':x[1]==='f'?'martes y viernes':x[1]==='l'?'al llegar':'al salir'}</span></label>`).join('')+`<button class="btn" id="ad">Añadir</button>`);
  $('#ad').onclick=()=>{$$('[data-tp]').filter(c=>c.checked).forEach(c=>{const[n,m,v]=TP[+c.dataset.tp],ex=S.tasks.find(t=>t.n===n);
    if(ex){if(!ex.hs.includes(S.h))ex.hs.push(S.h)}else S.tasks.push({id:uid(),n,m,e:m==='s'?v:14,w:m==='f'?v:[],hs:[S.h],note:''})});save();render();close()}}

/* ---------- eventos ---------- */
$('#mn').onclick=e=>{const ok=e.target.closest('[data-ok]'),rn=e.target.closest('[data-t]');
  if(ok){const l=addLog(ok.dataset.ok,ds(tk()),S.me);toast('Marcada ✓',l.i)}
  else if(rn)det(rn.dataset.t);
  else if(e.target.id==='nt')edit();else if(e.target.id==='tp')plantilla();
  else if(e.target.id==='ap'){S.people.push({id:uid(),n:'Nueva persona'});save();render()}
  else if(e.target.id==='ah'){S.homes.push({id:uid(),n:'Nuevo domicilio'});save();render()}
  else if(e.target.id==='ex'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='tareas-hogar.json';a.click()}};
$('#mn').onchange=e=>{const t=e.target;
  if(t.id==='me'){S.me=t.value;save()}
  else if(t.dataset.pn){S.people.find(p=>p.id===t.dataset.pn).n=t.value.trim()||'?';save()}
  else if(t.dataset.hn){S.homes.find(h=>h.id===t.dataset.hn).n=t.value.trim()||'?';save();hc()}
  else if(t.id==='im'){t.files[0].text().then(x=>{try{Object.assign(S,JSON.parse(x));save();render()}catch(_){alert('Archivo no válido')}})}};
$('#hc').onclick=e=>{const b=e.target.closest('[data-home]');if(b){S.h=b.dataset.home;save();render()}};
$('#mn').oninput=e=>{if(e.target.id==='hq'){window.hq=e.target.value;render();const i=$('#hq');i.focus();i.setSelectionRange(i.value.length,i.value.length)}};
$$('nav button').forEach(b=>b.onclick=()=>{V=+b.dataset.v;render()});
render();
</script>
</body>
</html>
