<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Devoluciones</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#eef2f1;--card:#fff;--ink:#18232b;--mute:#5d6b73;--line:#d6dedd;--acc:#0e6a61;--accT:#fff;--warn:#a85d00;--warnBg:#fff3df;--bad:#b3261e;--badBg:#fde8e6;--ok:#2a7a4b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1719;--card:#172226;--ink:#e6eeee;--mute:#93a4a7;--line:#2a3a3e;--acc:#3fc1b0;--accT:#062421;--warn:#f0a94a;--warnBg:#2e2412;--bad:#ff8a80;--badBg:#331a18;--ok:#6fd09a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1719;--card:#172226;--ink:#e6eeee;--mute:#93a4a7;--line:#2a3a3e;--acc:#3fc1b0;--accT:#062421;--warn:#f0a94a;--warnBg:#2e2412;--bad:#ff8a80;--badBg:#331a18;--ok:#6fd09a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:14px 14px 96px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:6px 2px 12px}
.big{font-size:2.6rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.lbl{color:var(--mute);font-size:.88rem}
.bell{position:relative;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:50%;width:44px;height:44px;font-size:1.2rem;cursor:pointer}
.bell b{position:absolute;top:-4px;right:-4px;background:var(--bad);color:#fff;border-radius:9px;font-size:.7rem;min-width:18px;padding:1px 4px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;margin-bottom:12px}
.panel .al{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:9px 10px;border-radius:8px;cursor:pointer;font:inherit}
.al.bad{color:var(--bad)}.al.warn{color:var(--warn)}.al:hover{background:var(--bg)}
nav{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:12px}
nav button{border:0;background:none;color:var(--mute);font:inherit;font-weight:500;padding:10px 12px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--ink);border-color:var(--acc);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 12px;font:inherit;font-size:.9rem;cursor:pointer}
.chip.on{background:var(--acc);color:var(--accT);border-color:var(--acc)}
select,input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.chips select{width:auto}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.card.warn{border-left-color:var(--warn)}.card.bad{border-left-color:var(--bad)}.card.esp{border-left-color:var(--acc)}.card.ok{opacity:.8;border-left-color:var(--ok)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.st{font-weight:700;font-size:1.05rem}.amt{font-weight:800;font-size:1.15rem;white-space:nowrap}
.meta{color:var(--mute);font-size:.88rem;margin-top:2px}
.tag{display:inline-block;border-radius:6px;padding:1px 8px;font-size:.8rem;font-weight:700;margin-top:6px;margin-right:4px}
.tag.warn{background:var(--warnBg);color:var(--warn)}.tag.bad{background:var(--badBg);color:var(--bad)}.tag.n{background:var(--bg);color:var(--mute)}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:.9rem;cursor:pointer}
.btn.p{background:var(--acc);color:var(--accT);border-color:var(--acc);font-weight:700}
.btn.d{color:var(--bad)}.btn.arm{background:var(--bad);color:#fff;border-color:var(--bad)}
.fab{position:fixed;right:max(16px,calc(50% - 344px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--acc);color:var(--accT);border:0;border-radius:28px;padding:15px 22px;font:inherit;font-weight:800;box-shadow:0 4px 16px rgba(0,0,0,.25);cursor:pointer}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);width:min(560px,94vw);max-height:92vh;padding:16px}
dialog::backdrop{background:rgba(0,0,0,.5)}
.f{display:grid;gap:10px}.f label{display:grid;gap:3px;font-size:.88rem;color:var(--mute)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex!important;grid-auto-flow:column;align-items:center;gap:8px;justify-content:start;color:var(--ink)!important}.chk input{width:auto}
.sug{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}.sug button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:8px 10px;font:inherit;cursor:pointer}.sug button:hover{background:var(--bg)}
h2{font-size:1.05rem;margin:18px 0 8px}
.err{color:var(--bad);font-size:.9rem;min-height:1.2em}
.bar{height:8px;border-radius:4px;background:var(--acc);margin-top:4px}
.empty{text-align:center;color:var(--mute);padding:34px 10px}
.idea.done textarea{text-decoration:line-through;opacity:.6}
.set{display:grid;grid-template-columns:1fr 90px auto;gap:6px;margin-bottom:6px;align-items:center}
.set.two{grid-template-columns:1fr auto}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="lbl">Dinero en el aire</div><div class="big" id="air">0,00 €</div><div class="lbl" id="airsub"></div></div>
    <button class="bell" data-a="bell" aria-label="Avisos">🔔<b id="bn" hidden></b></button>
  </header>
  <div id="bellp"></div>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<button class="fab" data-a="new">+ Nueva devolución</button>

<dialog id="fm"><div class="f">
  <h2 id="ft" style="margin:0">Nueva devolución</h2>
  <label>Tienda<input id="f-store" autocomplete="off" placeholder="Zara, Amazon…"></label>
  <div id="f-sug" class="sug" hidden></div>
  <div class="g2">
    <label>Importe (€)<input id="f-amt" inputmode="decimal" placeholder="39,95"></label>
    <label>Quién<select id="f-per"></select></label>
  </div>
  <div class="g2">
    <label>Medio de pago<select id="f-met"></select></label>
    <label>Estado<select id="f-st"><option value="por">Por devolver</option><option value="esp">Esperando reembolso</option><option value="ok">Completado</option></select></label>
  </div>
  <label class="chk"><input type="checkbox" id="f-mob"> Pagado con el móvil (Apple Pay / Google Pay)</label>
  <div class="g2">
    <label>Fecha de compra<input type="date" id="f-buy"></label>
    <label>Fecha límite para devolver<input type="date" id="f-due"></label>
  </div>
  <div class="g2">
    <label>Nº de seguimiento (opcional)<input id="f-trk"></label>
    <label>Transportista<select id="f-car"><option value="">—</option><option>Correos</option><option>SEUR</option><option>GLS</option><option>UPS</option><option>DHL</option><option>Otro</option></select></label>
  </div>
  <label>Nota (opcional, puedes pegar el mensaje de WhatsApp)<textarea id="f-note" rows="2"></textarea></label>
  <label class="chk"><input type="checkbox" id="f-save"> Guardar tienda para la próxima vez</label>
  <label id="f-dl">Plazo de devolución de la tienda (días)<input id="f-days" inputmode="numeric" placeholder="30"></label>
  <div class="err" id="ferr"></div>
  <div class="acts"><button class="btn p" data-a="saveForm">Guardar</button><button class="btn" data-a="close" data-t="fm">Cancelar</button></div>
</div></dialog>

<dialog id="pm"><div class="f">
  <h2 id="pt" style="margin:0">Reembolso recibido</h2>
  <div class="lbl" id="pe"></div>
  <div class="g2">
    <label>Importe recibido (€)<input id="p-amt" inputmode="decimal"></label>
    <label>Fecha<input type="date" id="p-date"></label>
  </div>
  <div class="acts"><button class="btn p" data-a="savePaid">Marcar como cobrado</button><button class="btn" data-a="close" data-t="pm">Cancelar</button></div>
</div></dialog>

<dialog id="bm"><div class="f">
  <h2 style="margin:0">Copia de seguridad</h2>
  <div class="lbl">Descarga el archivo o copia el texto y guárdalo (notas, correo…). Para restaurar, pega el texto aquí o elige el archivo.</div>
  <textarea id="bk" rows="8" spellcheck="false"></textarea>
  <div class="acts"><button class="btn p" data-a="bkDown">Descargar archivo</button><button class="btn" data-a="bkCopy">Copiar texto</button><button class="btn d" data-a="bkRest">Restaurar</button></div>
  <label>O elige un archivo .json<input type="file" id="bk-file" accept=".json,application/json"></label>
  <div class="err" id="bkmsg"></div>
  <div class="acts"><button class="btn" data-a="close" data-t="bm">Cerrar</button></div>
</div></dialog>

<script>
const $=s=>document.querySelector(s), v=id=>$('#'+id).value;
const K='devoluciones_v1';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(n||0);
const num=s=>{s=String(s).trim().replace(/\s|€/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=parseFloat(s);return isNaN(n)?0:Math.round(n*100)/100};
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const diff=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const addD=(i,n)=>{const d=new Date(i);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const fd=i=>i?i.split('-').reverse().join('/'):'';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const nm=(a,id)=>(a.find(x=>x.id==id)||{}).name||'—';
const cnt=(a,s)=>a.length+' '+(a.length==1?s:s+'s');

let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=Object.assign({returns:[],people:[],methods:[],stores:[],ideas:[],set:{late:14,changes:0,lastBackup:null},seeded:false},S||{});
if(!S.seeded){S.seeded=true;S.people=[{id:uid(),name:'Yo'},{id:uid(),name:'Mi mujer'}];S.methods=[{id:uid(),name:'Bizum'},{id:uid(),name:'PayPal'},{id:uid(),name:'Tarjeta'}]}
function save(count=true){if(count)S.set.changes++;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
save(false);

const V={tab:'dev',f:'pend',p:'all',month:today().slice(0,7),bell:false,hid:false};
const TABS=[['dev','Devoluciones'],['bank','Verificar banco'],['sum','Resumen'],['ideas','Ideas'],['set','Ajustes']];
const CARS={Correos:'https://www.correos.es/es/es/herramientas/localizador/envios/detalle?tracking-number=',SEUR:'https://www.seur.com/livetracking/?segOnlineIdentificador=',GLS:'https://gls-group.com/ES/es/seguimiento-de-envios?match=',UPS:'https://www.ups.com/track?tracknum=',DHL:'https://www.dhl.com/es-es/home/tracking.html?tracking-id='};

function alerts(){const a=[],t=today();
  S.returns.forEach(r=>{
    if(r.status==='por'&&r.due){const d=diff(t,r.due);
      if(d<0)a.push({c:'bad',t:`${r.store}: plazo vencido hace ${-d} día${-d>1?'s':''}`});
      else if(d<=3)a.push({c:'warn',t:`${r.store}: vence ${d==0?'hoy':d==1?'mañana':'en '+d+' días'}`})}
    if(r.status==='esp'&&r.sent&&diff(r.sent,t)>=S.set.late)a.push({c:'warn',t:`${r.store}: ${diff(r.sent,t)} días esperando el reembolso`})});
  if(S.set.changes>=10)a.push({c:'info',t:`${S.set.changes} cambios sin copia de seguridad. Toca para hacerla`,act:'bk'});
  return a}

function head(){
  const esp=S.returns.filter(r=>r.status==='esp');
  $('#air').textContent=eur(esp.reduce((s,r)=>s+r.exp,0));
  const por=S.returns.filter(r=>r.status==='por');
  $('#airsub').textContent=`${cnt(esp,'reembolso')} esperando · ${eur(por.reduce((s,r)=>s+r.exp,0))} por devolver`;
  const al=alerts(),b=$('#bn');b.hidden=!al.length;b.textContent=al.length;
  $('#bellp').innerHTML=V.bell?`<div class="panel">${al.length?al.map(x=>`<button class="al ${x.c}" data-a="alert" data-k="${x.act||''}">${esc(x.t)}</button>`).join(''):'<div class="empty" style="padding:12px">Todo en orden, sin avisos.</div>'}</div>`:'';
  $('#nav').innerHTML=TABS.map(([k,n])=>`<button class="${V.tab==k?'on':''}" data-a="tab" data-k="${k}">${n}</button>`).join('');
  $('.fab').hidden=V.tab!=='dev'&&V.tab!=='bank'}

function card(r){const t=today(),d=r.due?diff(t,r.due):null;let cls=r.status==='ok'?'ok':r.status==='esp'?'esp':'',tags='';
  if(r.status==='por'&&d!==null){cls=d<0?'bad':d<=3?'warn':'';tags+=`<span class="tag ${d<=3?(d<0?'bad':'warn'):'n'}">${d<0?`Vencido hace ${-d} d`:d==0?'Vence hoy':`Quedan ${d} días`} (${fd(r.due)})</span>`}
  if(r.status==='esp'&&r.sent){const w=diff(r.sent,t);tags+=`<span class="tag ${w>=S.set.late?'warn':'n'}">${w} d esperando</span>`}
  if(r.status==='ok'){tags+=`<span class="tag n">Cobrado ${fd(r.done)}</span>`;if(r.recv!==r.exp)tags+=`<span class="tag warn">Recibido ${eur(r.recv)} de ${eur(r.exp)}</span>`}
  const link=r.track?(CARS[r.car]?`<a href="${CARS[r.car]+encodeURIComponent(r.track)}" target="_blank" rel="noopener">Seguir envío</a>`:`<a href="https://www.google.com/search?q=${encodeURIComponent(r.track)}" target="_blank" rel="noopener">Buscar envío</a>`):'';
  const main=r.status==='por'?`<button class="btn p" data-a="sent" data-id="${r.id}">Ya lo envié</button>`:r.status==='esp'?`<button class="btn p" data-a="paid" data-id="${r.id}">Me han pagado</button>`:`<button class="btn" data-a="reopen" data-id="${r.id}">Reabrir</button>`;
  return `<div class="card ${cls}"><div class="row"><span class="st">${esc(r.store)}</span><span class="amt">${eur(r.exp)}</span></div>
  <div class="meta">${esc(nm(S.people,r.person))} · ${esc(nm(S.methods,r.method))}${r.mob?' (móvil)':''}${r.track?` · ${esc(r.car||'')} ${esc(r.track)}`:''} ${link}</div>
  ${tags?`<div>${tags}</div>`:''}${r.note?`<div class="meta" style="white-space:pre-wrap">${esc(r.note)}</div>`:''}
  <div class="acts">${main}<button class="btn" data-a="edit" data-id="${r.id}">Editar</button><button class="btn d" data-a="del" data-id="${r.id}">Borrar</button></div></div>`}

function vDev(){
  const L=S.returns,c=s=>L.filter(r=>r.status==s).length;
  const F=[['pend','Pendientes',c('por')+c('esp')],['por','Por devolver',c('por')],['esp','Esperando reembolso',c('esp')],['ok','Historial',c('ok')]];
  let l=L.filter(r=>V.f=='pend'?r.status!='ok':r.status==V.f);
  if(V.p!='all')l=l.filter(r=>r.person==V.p);
  const ord={por:0,esp:1,ok:2};
  l.sort((a,b)=>ord[a.status]-ord[b.status]||(a.status=='ok'?(b.done||'').localeCompare(a.done||''):(a.due||a.sent||'9').localeCompare(b.due||b.sent||'9')));
  return `<div class="chips">${F.map(([k,n,x])=>`<button class="chip ${V.f==k?'on':''}" data-a="f" data-k="${k}">${n} ${x}</button>`).join('')}
  <select data-ch="pf" aria-label="Persona"><option value="all">Todos</option>${S.people.map(p=>`<option value="${p.id}" ${V.p==p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>`
  +(l.length?l.map(card).join(''):`<div class="empty">${L.length?'No hay nada en esta vista.':'Aún no hay devoluciones. Toca «Nueva devolución» para añadir la primera.'}</div>`)}

function vBank(){
  const l=S.returns.filter(r=>r.status==='esp');
  if(!l.length)return '<div class="empty">No hay reembolsos esperando. Nada que verificar.</div>';
  const g={};l.forEach(r=>(g[r.method]=g[r.method]||[]).push(r));
  return '<div class="lbl" style="margin-bottom:8px">Abre el banco o app y marca lo que ya veas ingresado.</div>'+Object.keys(g).map(k=>{
    const a=g[k].sort((x,y)=>(x.sent||'').localeCompare(y.sent||''));
    return `<h2>${esc(nm(S.methods,k))} · ${eur(a.reduce((s,r)=>s+r.exp,0))}</h2>`+a.map(r=>`<div class="card esp"><div class="row"><span class="st">${esc(r.store)}</span><span class="amt">${eur(r.exp)}</span></div>
    <div class="meta">${esc(nm(S.people,r.person))}${r.mob?' · con móvil':''} · enviado ${fd(r.sent)}</div><div class="acts"><button class="btn p" data-a="paid" data-id="${r.id}">Ya ingresado</button></div></div>`).join('')}).join('')}

function vSum(){
  const m=V.month,ok=S.returns.filter(r=>r.status==='ok'&&(r.done||'').startsWith(m));
  const tot=ok.reduce((s,r)=>s+r.recv,0),dif=ok.reduce((s,r)=>s+(r.exp-r.recv),0);
  const grp=(f)=>{const o={};ok.forEach(r=>{const k=f(r);o[k]=(o[k]||0)+r.recv});return Object.entries(o).sort((a,b)=>b[1]-a[1])};
  const bars=a=>{const mx=a.length?a[0][1]:1;return a.map(([k,x])=>`<div style="margin-bottom:8px"><div class="row"><span>${esc(k)}</span><b>${eur(x)}</b></div><div class="bar" style="width:${Math.max(3,x/mx*100)}%"></div></div>`).join('')||'<div class="lbl">Sin datos este mes.</div>'};
  return `<label class="lbl">Mes<input type="month" data-ch="month" value="${m}" style="max-width:200px"></label>
  <div class="card" style="margin-top:12px"><div class="lbl">Cobrado en el mes</div><div class="big">${eur(tot)}</div><div class="meta">${cnt(ok,'devolución')}${Math.abs(dif)>0.004?` · diferencia frente a lo esperado: ${eur(dif)}`:''}</div></div>
  <h2>Por tienda</h2>${bars(grp(r=>r.store))}<h2>Por persona</h2>${bars(grp(r=>nm(S.people,r.person)))}<h2>Por medio de pago</h2>${bars(grp(r=>nm(S.methods,r.method)))}`}

function vIdeas(){
  const hid=S.ideas.filter(i=>i.hidden).length;
  const l=S.ideas.filter(i=>V.hid||!i.hidden).sort((a,b)=>a.done-b.done);
  return `<div class="f"><textarea id="newidea" rows="3" placeholder="Apunta aquí una idea o mejora…"></textarea><div class="acts"><button class="btn p" data-a="addIdea">Añadir idea</button>${hid?`<button class="btn" data-a="showHid">${V.hid?'Ocultar':'Ver'} ocultas (${hid})</button>`:''}</div></div><div style="margin-top:14px">`
  +(l.length?l.map(i=>`<div class="card idea ${i.done?'done':''}"><textarea rows="${Math.min(8,Math.max(2,i.text.split('\n').length))}" data-ch="idea" data-id="${i.id}">${esc(i.text)}</textarea>
  <div class="acts"><button class="btn ${i.done?'':'p'}" data-a="ideaDone" data-id="${i.id}">${i.done?'Quitar implementada':'Marcar implementada'}</button><button class="btn" data-a="ideaHide" data-id="${i.id}">${i.hidden?'Mostrar':'Ocultar'}</button><button class="btn d" data-a="ideaDel" data-id="${i.id}">Borrar</button></div></div>`).join(''):'<div class="empty">Sin ideas todavía.</div>')+'</div>'}

function vSet(){
  const lst=(a,key,label)=>`<h2>${label}</h2>`+a.map(x=>`<div class="set two"><input data-ch="ren" data-k="${key}" data-id="${x.id}" value="${esc(x.name)}"><button class="btn d" data-a="delItem" data-k="${key}" data-id="${x.id}">Borrar</button></div>`).join('')
   +`<div class="set two"><input id="add-${key}" placeholder="Añadir…"><button class="btn p" data-a="addItem" data-k="${key}">Añadir</button></div>`;
  const u=n=>S.returns.filter(r=>r.store.toLowerCase()==n.toLowerCase()).length;
  return lst(S.people,'people','Personas')+lst(S.methods,'methods','Tarjetas y medios de pago')
  +`<h2>Tiendas guardadas</h2>`+(S.stores.length?S.stores.map(s=>`<div class="set"><input data-ch="ren" data-k="stores" data-id="${s.id}" value="${esc(s.name)}"><input data-ch="days" data-id="${s.id}" value="${s.days||''}" placeholder="días" inputmode="numeric" aria-label="Plazo en días"><button class="btn d" data-a="delItem" data-k="stores" data-id="${s.id}">Borrar</button></div>`).join(''):'<div class="lbl">Se guardan al crear una devolución marcando «Guardar tienda». Aquí podrás corregirlas.</div>')
  +`<h2>Aviso de reembolso tardío</h2><label class="lbl">Resaltar si lleva más de (días) esperando<input data-ch="late" value="${S.set.late}" inputmode="numeric" style="max-width:120px"></label>
  <h2>Copia de seguridad</h2><div class="lbl">${S.set.lastBackup?'Última copia: '+fd(S.set.lastBackup):'Aún no has hecho ninguna copia.'} · ${S.set.changes} cambios desde entonces.</div><div class="acts"><button class="btn p" data-a="bk">Copia de seguridad / restaurar</button></div>`}

function render(){head();$('#main').innerHTML={dev:vDev,bank:vBank,sum:vSum,ideas:vIdeas,set:vSet}[V.tab]()}

/* formulario */
let editing=null,dueTouched=false;
const fs=n=>S.stores.find(s=>s.name.toLowerCase()==n.trim().toLowerCase());
function opts(a,sel){return a.length?a.map(x=>`<option value="${x.id}" ${x.id==sel?'selected':''}>${esc(x.name)}</option>`).join(''):'<option value="">(añádelo en Ajustes)</option>'}
function openForm(id){editing=id;const r=id?S.returns.find(x=>x.id==id):null;
  $('#ft').textContent=r?'Editar devolución':'Nueva devolución';$('#ferr').textContent='';
  $('#f-store').value=r?r.store:'';$('#f-amt').value=r?String(r.exp).replace('.',','):'';
  $('#f-per').innerHTML=opts(S.people,r?r.person:S.people[0]?.id);$('#f-met').innerHTML=opts(S.methods,r?r.method:'');
  $('#f-st').value=r?r.status:'por';$('#f-mob').checked=!!(r&&r.mob);
  $('#f-buy').value=r?r.buy:today();$('#f-due').value=r?r.due||'':'';dueTouched=!!(r&&r.due);
  $('#f-trk').value=r?r.track||'':'';$('#f-car').value=r?r.car||'':'';$('#f-note').value=r?r.note||'':'';
  const s=r&&fs(r.store);$('#f-save').checked=!!s;$('#f-days').value=s&&s.days?s.days:'';
  sug();$('#fm').showModal();if(!r)$('#f-store').focus()}
function sug(){const q=v('f-store').trim().toLowerCase(),b=$('#f-sug');
  const use=n=>S.returns.filter(r=>r.store.toLowerCase()==n.toLowerCase()).length;
  const l=S.stores.filter(s=>s.name.toLowerCase().includes(q)&&s.name.toLowerCase()!=q).sort((a,b)=>use(b.name)-use(a.name)||a.name.localeCompare(b.name)).slice(0,6);
  b.hidden=!l.length;b.innerHTML=l.map(s=>`<button type="button" data-a="pick" data-id="${s.id}">${esc(s.name)}${s.days?` · ${s.days} días`:''}</button>`).join('')}
function storeChanged(){const s=fs(v('f-store'));if(s){$('#f-save').checked=true;if(s.days)$('#f-days').value=s.days}autoDue()}
function autoDue(){if(dueTouched)return;const s=fs(v('f-store')),d=parseInt(v('f-days'))||(s&&s.days);if(d&&v('f-buy'))$('#f-due').value=addD(v('f-buy'),d)}
function saveForm(){
  const store=v('f-store').trim(),amt=num(v('f-amt'));
  if(!store||amt<=0){$('#ferr').textContent='Indica la tienda y un importe mayor que 0.';return}
  const r=editing?S.returns.find(x=>x.id==editing):{id:uid(),status:'por'};
  Object.assign(r,{store,exp:amt,person:v('f-per'),method:v('f-met'),mob:$('#f-mob').checked,buy:v('f-buy'),due:v('f-due'),track:v('f-trk').trim(),car:v('f-car'),note:v('f-note').trim()});
  const st=v('f-st');if(st!==r.status||!editing){r.status=st;if(st==='esp'&&!r.sent)r.sent=today();if(st==='ok'){r.sent=r.sent||today();r.recv=r.recv??amt;r.done=r.done||today()}}
  if(!editing)S.returns.push(r);
  if($('#f-save').checked){const d=parseInt(v('f-days'))||0,s=fs(store);if(s){if(d)s.days=d}else S.stores.push({id:uid(),name:store,days:d})}
  save();$('#fm').close();render()}

let payId=null;
function openPaid(id){payId=id;const r=S.returns.find(x=>x.id==id);$('#pt').textContent=r.store;$('#pe').textContent='Importe esperado: '+eur(r.exp);$('#p-amt').value=String(r.exp).replace('.',',');$('#p-date').value=today();$('#pm').showModal()}
function savePaid(){const r=S.returns.find(x=>x.id==payId);r.status='ok';r.recv=num(v('p-amt'));r.done=v('p-date')||today();save();$('#pm').close();render()}

/* copia de seguridad */
function bkOpen(){$('#bk').value='';$('#bkmsg').textContent='';$('#bm').showModal()}
function bkStamp(){S.set.lastBackup=today();S.set.changes=0;save(false);render()}
function bkText(){const t=JSON.stringify(S,null,1);$('#bk').value=t;return t}
function bkLoad(t){try{const d=JSON.parse(t);if(!Array.isArray(d.returns))throw 0;S=Object.assign({returns:[],people:[],methods:[],stores:[],ideas:[],set:{late:14,changes:0,lastBackup:null},seeded:true},d);save(false);render();$('#bkmsg').textContent='Copia restaurada correctamente.'}catch(e){$('#bkmsg').textContent='El texto no es una copia válida.'}}

/* eventos */
const arm=b=>{if(b.dataset.arm)return true;b.dataset.arm=1;const o=b.textContent;b.textContent='¿Seguro?';b.classList.add('arm');setTimeout(()=>{b.textContent=o;b.classList.remove('arm');delete b.dataset.arm},3000);return false};
document.addEventListener('click',e=>{
  if(!e.target.closest('.bell,.panel'))if(V.bell){V.bell=false;head()}
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id,k=b.dataset.k;
  const R=()=>S.returns.find(x=>x.id==id);
  switch(a){
    case 'bell':V.bell=!V.bell;head();e.stopPropagation();break;
    case 'alert':V.bell=false;if(k==='bk'){bkOpen()}else{V.tab='dev';V.f='pend'}render();break;
    case 'tab':V.tab=k;render();break;
    case 'f':V.f=k;render();break;
    case 'new':openForm();break;
    case 'edit':openForm(id);break;
    case 'close':$('#'+b.dataset.t).close();break;
    case 'saveForm':saveForm();break;
    case 'pick':{const s=S.stores.find(x=>x.id==id);$('#f-store').value=s.name;sug();storeChanged();break}
    case 'sent':{const r=R();r.status='esp';r.sent=today();save();render();break}
    case 'paid':openPaid(id);break;
    case 'savePaid':savePaid();break;
    case 'reopen':{const r=R();r.status='esp';save();render();break}
    case 'del':if(arm(b)){S.returns=S.returns.filter(x=>x.id!=id);save();render()}break;
    case 'addIdea':{const t=v('newidea').trim();if(t){S.ideas.unshift({id:uid(),text:t,done:false,hidden:false});save();render()}break}
    case 'ideaDone':{const i=S.ideas.find(x=>x.id==id);i.done=!i.done;save();render();break}
    case 'ideaHide':{const i=S.ideas.find(x=>x.id==id);i.hidden=!i.hidden;save();render();break}
    case 'ideaDel':if(arm(b)){S.ideas=S.ideas.filter(x=>x.id!=id);save();render()}break;
    case 'showHid':V.hid=!V.hid;render();break;
    case 'addItem':{const t=v('add-'+k).trim();if(t){S[k].push({id:uid(),name:t});save();render()}break}
    case 'delItem':if(arm(b)){S[k]=S[k].filter(x=>x.id!=id);save();render()}break;
    case 'bk':bkOpen();break;
    case 'bkDown':{const t=bkText(),u=URL.createObjectURL(new Blob([t],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='devoluciones-'+today()+'.json';document.body.appendChild(l);l.click();l.remove();bkStamp();$('#bkmsg').textContent='Si no se descarga el archivo, usa «Copiar texto».';break}
    case 'bkCopy':{const t=bkText();bkStamp();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>$('#bkmsg').textContent='Texto copiado.').catch(()=>{$('#bk').select();try{document.execCommand('copy')}catch(x){}$('#bkmsg').textContent='Selecciona y copia el texto de arriba.'});break}
    case 'bkRest':if(arm(b))bkLoad(v('bk'));break;
  }});
document.addEventListener('change',e=>{const t=e.target,c=t.dataset.ch;if(!c){if(t.id==='f-buy')autoDue();return}
  if(c==='pf'){V.p=t.value;render()}
  else if(c==='month'){V.month=t.value||V.month;render()}
  else if(c==='late'){S.set.late=parseInt(t.value)||14;save();render()}
  else if(c==='idea'){S.ideas.find(x=>x.id==t.dataset.id).text=t.value;save()}
  else if(c==='days'){S.stores.find(x=>x.id==t.dataset.id).days=parseInt(t.value)||0;save()}
  else if(c==='ren'){const o=S[t.dataset.k].find(x=>x.id==t.dataset.id),n=t.value.trim();if(!n){t.value=o.name;return}
    if(t.dataset.k==='stores')S.returns.forEach(r=>{if(r.store.toLowerCase()==o.name.toLowerCase())r.store=n});o.name=n;save();render()}});
$('#f-store').addEventListener('input',()=>{sug();storeChanged()});
$('#f-days').addEventListener('input',autoDue);
$('#f-due').addEventListener('input',()=>dueTouched=true);
$('#bk-file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#bk').value=r.result;$('#bkmsg').textContent='Archivo cargado. Pulsa «Restaurar» (dos veces) para aplicarlo.'};r.readAsText(f)});
render();
</script>
</body>
</html>
