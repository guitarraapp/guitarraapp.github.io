<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15171d">
<title>Afinador de guitarra</title>
<style>
:root{--bg:#15171d;--panel:#1e2128;--line:#32363f;--amber:#ffb224;--ok:#6fd68e;--tx:#f4f2ec;--dim:#9a9ca6}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,select,input{touch-action:manipulation}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);display:flex;justify-content:center;overscroll-behavior:none}
#app{width:100%;max-width:480px;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 14px 0}
header{display:flex;justify-content:space-between;align-items:center;height:34px;font-size:.95rem;font-weight:600;color:var(--amber)}
#lv{width:90px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}#lvb{display:block;height:100%;width:0;background:var(--amber)}
main{flex:1;overflow-y:auto;padding:6px 0 14px}
#disp{text-align:center}
#note{font-family:"Avenir Next Condensed","Arial Narrow",Impact,sans-serif;font-size:clamp(5.5rem,30vw,8rem);font-weight:800;line-height:1;min-height:1em}
#note small{font-size:.28em;font-weight:600;color:var(--dim);margin-left:4px}
#sol{font-size:1rem;color:var(--dim);min-height:1.3em}
#cents{font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;min-height:1.3em;margin-top:4px}
#gauge{position:relative;height:72px;margin:12px 6px 2px}
.t{position:absolute;top:32px;width:2px;height:12px;margin-left:-1px;background:var(--line)}
.t.m{top:26px;height:24px;background:var(--dim)}
#zone{position:absolute;left:47%;width:6%;top:20px;height:46px;border-radius:6px;background:rgba(255,178,36,.12)}
#needle{position:absolute;top:8px;left:50%;width:4px;height:60px;margin-left:-2px;border-radius:2px;background:var(--amber);box-shadow:0 0 12px rgba(255,178,36,.5);opacity:.3}
.scale{display:flex;justify-content:space-between;margin:0 6px;font-size:.8rem;color:var(--dim)}
#hz{text-align:center;font-size:.85rem;color:var(--dim);min-height:1.2em;margin-top:8px;font-variant-numeric:tabular-nums}
#hint{text-align:center;font-size:1rem;font-weight:600;min-height:1.5em;margin:6px 0 14px}
.act #needle{opacity:1}
.ok #needle{background:var(--ok);box-shadow:0 0 14px rgba(111,214,142,.7)}.ok #zone{background:rgba(111,214,142,.3)}
.ok #note,.ok #hint,.ok #cents{color:var(--ok)}
#strs{display:flex;gap:8px;margin-bottom:6px}
.str{flex:1;height:64px;border-radius:14px;border:2px solid var(--line);background:var(--panel);color:var(--tx);font-size:1.2rem;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.str small{font-size:.7rem;font-weight:500;color:var(--dim)}
.str.lock{border-color:var(--amber)}.str.sel{background:var(--amber);color:#111}.str.sel small{color:#333}
.str.done{border-color:var(--ok);color:var(--ok)}.str.done small::after{content:" ✓"}
.hl{font-size:.78rem;color:var(--dim);text-align:center;margin-bottom:16px}
h3{font-size:.85rem;font-weight:600;color:var(--dim);margin:14px 0 8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--tx);font-size:1.3rem;font-weight:700}
.step button:active{background:var(--amber);color:#111}
.step b{min-width:92px;text-align:center;font-size:1.3rem;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--tx);font-size:1rem}
.chip.sel{background:var(--amber);color:#111;border-color:var(--amber);font-weight:700}
select{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--tx);font-size:16px;padding:0 12px}
footer{display:flex;gap:10px;padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
footer button{height:64px;border-radius:18px;border:0;font-size:1.2rem;font-weight:800}
#ref{flex:0 0 34%;background:var(--panel);color:var(--tx);border:1px solid var(--line)}
#mic{flex:1;background:var(--amber);color:#111}#mic.on{background:#ff5a4d;color:#fff}
button:focus-visible,select:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<div id="app">
<header><span id="tl">Afinador</span><div id="lv" title="Nivel de entrada"><i id="lvb"></i></div></header>
<main id="main">
<div id="disp">
<div id="note">—</div><div id="sol"></div><div id="cents"></div>
</div>
<div id="gauge"><div id="zone"></div><div id="needle"></div></div>
<div class="scale"><span>♭ −50</span><span>0</span><span>+50 ♯</span></div>
<div id="hz"></div>
<div id="hint">Pulsa «Activar micro» y toca una cuerda al aire</div>
<div id="strs"></div>
<p class="hl">Automático por defecto. Toca una cuerda para fijarla; vuelve a tocarla para soltarla.</p>
<h3>Referencia (La4)</h3>
<div class="row"><span>Frecuencia</span>
<div class="step"><button data-a="-1" aria-label="Bajar 1 Hz">−</button><b id="a4"></b><button data-a="1" aria-label="Subir 1 Hz">+</button></div></div>
<div class="chips" id="c-a4"></div>
<h3>Afinación</h3><select id="tun" aria-label="Afinación"></select>
<h3>Estabilidad de la aguja</h3><div class="chips" id="c-st"></div>
</main>
<footer><button id="ref">Nota guía</button><button id="mic">Activar micro</button></footer>
</div>
<script>
const $=s=>document.querySelector(s);
const TUN={'Estándar':'E2 A2 D3 G3 B3 E4','Drop D':'D2 A2 D3 G3 B3 E4','Medio tono abajo':'Eb2 Ab2 Db3 Gb3 Bb3 Eb4','Un tono abajo':'D2 G2 C3 F3 A3 D4','DADGAD':'D2 A2 D3 G3 A3 D4','Open G':'D2 G2 D3 G3 B3 D4','Open D':'D2 A2 D3 F#3 A3 D4','Open E':'E2 B2 E3 G#3 B3 E4'};
const SEMI={C:0,D:2,E:4,F:5,G:7,A:9,B:11},SOL={C:'Do',D:'Re',E:'Mi',F:'Fa',G:'Sol',A:'La',B:'Si'};
const STAB=[{n:'Rápido',k:3,a:.4},{n:'Normal',k:7,a:.18},{n:'Estable',k:13,a:.08}];
let S={a4:440,tun:'Estándar',stab:1};
try{Object.assign(S,JSON.parse(localStorage.getItem('tuner1')||'{}'))}catch(e){}
if(!TUN[S.tun])S.tun='Estándar';
const save=()=>{try{localStorage.setItem('tuner1',JSON.stringify(S))}catch(e){}};
const ST=()=>STAB[S.stab]||STAB[1];
const freq=m=>S.a4*2**((m-69)/12);
const cl=c=>Math.max(-50,Math.min(50,c));
function parse(n){const m=n.match(/^([A-G])([#b]?)(\d)$/),a=m[2]==='#'?'♯':m[2]==='b'?'♭':'';
  return{midi:12*(+m[3]+1)+SEMI[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0),name:m[1]+a,sol:SOL[m[1]]+a,oct:m[3]}}

let strs=[],done=[],manual=null,locked=null,cand=null,candN=0,hist=[],jump=0,disp=0,cents=0,curF=0,tgt=null,lastSeen=0,inSince=0,refUntil=0;
let ac,an,buf,src,stream,timer,listening=false,wl=null,err='';

/* ---------- detección de tono (YIN) ---------- */
function yin(b,sr){
  const W=b.length>>1,tMax=Math.min(W-1,Math.floor(sr/60)),tMin=Math.max(2,Math.floor(sr/1200)),d=new Float32Array(tMax+2);
  for(let t=1;t<=tMax;t++){let s=0;for(let i=0;i<W;i++){const x=b[i]-b[i+t];s+=x*x}d[t]=s}
  let run=0;for(let t=1;t<=tMax;t++){run+=d[t];d[t]=run?d[t]*t/run:1}
  for(let t=tMin;t<tMax;t++){
    if(d[t]<.15){
      while(t+1<tMax&&d[t+1]<d[t])t++;
      const a=d[t-1],c=d[t+1],den=a-2*d[t]+c,sh=den?(a-c)/(2*den):0;
      return sr/(t+sh);
    }
  }
  return null;
}
const median=a=>{const s=[...a].sort((x,y)=>x-y);return s[s.length>>1]};

function analyse(){
  if(!listening||performance.now()<refUntil)return;
  an.getFloatTimeDomainData(buf);
  let r=0;for(const x of buf)r+=x*x;r=Math.sqrt(r/buf.length);
  $('#lvb').style.width=Math.min(100,r*500)+'%';
  if(r<.01)return;
  const f0=yin(buf,ac.sampleRate);
  if(!f0||f0<60||f0>1200)return;
  if(hist.length){
    if(Math.abs(Math.log2(f0/median(hist)))>.08){if(++jump<3)return;hist=[];jump=0}else jump=0;
  }
  hist.push(f0);while(hist.length>ST().k)hist.shift();
  const f=median(hist),now=performance.now(),mf=69+12*Math.log2(f/S.a4);
  let idx;
  if(manual!==null)idx=manual;
  else{
    let best=0,bd=1e9;strs.forEach((s,i)=>{const d=Math.abs(mf-s.midi);if(d<bd){bd=d;best=i}});
    if(locked===null)setLocked(best);
    else if(best!==locked){if(cand===best)candN++;else{cand=best;candN=1}if(candN>=5){setLocked(best);candN=0}}
    else candN=0;
    idx=locked;
  }
  tgt=idx;curF=f;lastSeen=now;cents=1200*Math.log2(f/freq(strs[idx].midi));
  if(Math.abs(cents)<=3){
    if(!inSince)inSince=now;
    else if(now-inSince>700&&!done[idx]){done[idx]=true;drawStrs();if(navigator.vibrate)navigator.vibrate(40)}
  }else inSince=0;
}
function setLocked(i){if(locked!==i){locked=i;drawStrs()}}

/* ---------- pintado ---------- */
function render(){
  if(!listening)return;
  const act=tgt!==null&&performance.now()-lastSeen<1300;
  if(act)disp+=(cl(cents)-disp)*ST().a;
  const ok=act&&Math.abs(disp)<=3;
  $('#app').className=(act?'act ':'')+(ok?'ok':'');
  $('#needle').style.left=(50+disp)+'%';
  if(tgt!==null){const s=strs[tgt];$('#note').innerHTML=s.name+'<small>'+s.oct+'</small>';$('#sol').textContent=s.sol}
  $('#cents').textContent=act?(Math.round(disp)>0?'+':'')+Math.round(disp)+' cents':'';
  $('#hz').textContent=act?curF.toFixed(1)+' Hz  →  '+freq(strs[tgt].midi).toFixed(1)+' Hz':'';
  $('#hint').textContent=err||(!act?'Toca una cuerda al aire':ok?'¡Afinada!':disp<0?'Grave: aprieta la cuerda':'Aguda: afloja la cuerda');
  requestAnimationFrame(render);
}
function drawStrs(){
  const el=$('#strs');el.innerHTML='';
  strs.forEach((s,i)=>{
    const b=document.createElement('button');
    b.className='str'+(manual===i?' sel':manual===null&&locked===i&&listening?' lock':'')+(done[i]?' done':'');
    b.innerHTML=s.name+'<small>cuerda '+(6-i)+'</small>';
    b.onclick=()=>{manual=manual===i?null:i;if(manual===null)locked=null;hist=[];tgt=manual;inSince=0;drawStrs();if(manual!==null)showNote()};
    el.appendChild(b);
  });
}
function showNote(){if(tgt!==null){const s=strs[tgt];$('#note').innerHTML=s.name+'<small>'+s.oct+'</small>';$('#sol').textContent=s.sol}}
function setTuning(){
  strs=TUN[S.tun].split(' ').map(parse);done=[];manual=null;locked=null;tgt=null;hist=[];disp=0;inSince=0;
  $('#note').textContent='—';$('#sol').textContent='';$('#cents').textContent='';$('#hz').textContent='';
  drawStrs();
}

/* ---------- micrófono y tono de referencia ---------- */
function initAudio(){ if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)(); if(ac.state!=='running')ac.resume() }
async function lock(on){try{if(on)wl=await navigator.wakeLock.request('screen');else if(wl){wl.release();wl=null}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(listening&&document.visibilityState==='visible')lock(true)});
async function listen(){
  initAudio();err='';
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})}
  catch(e){err='No se pudo usar el micrófono. Revisa el permiso del navegador; el micrófono solo funciona en páginas servidas por https.';$('#hint').textContent=err;return}
  src=ac.createMediaStreamSource(stream);an=ac.createAnalyser();an.fftSize=4096;buf=new Float32Array(4096);src.connect(an);
  listening=true;hist=[];timer=setInterval(analyse,50);lock(true);
  $('#mic').textContent='Pausar';$('#mic').classList.add('on');drawStrs();requestAnimationFrame(render);
}
function pause(){
  listening=false;clearInterval(timer);stream&&stream.getTracks().forEach(t=>t.stop());src&&src.disconnect();lock(false);
  $('#mic').textContent='Activar micro';$('#mic').classList.remove('on');$('#app').className='';$('#lvb').style.width=0;
  $('#hint').textContent='Pulsa «Activar micro» y toca una cuerda al aire';drawStrs();
}
$('#mic').onclick=()=>listening?pause():listen();
let refStop=null;
function stopRef(){if(refStop){refStop();refStop=null}refUntil=0;$('#ref').textContent='Nota guía'}
$('#ref').onclick=()=>{
  if(refStop)return stopRef();
  initAudio();const i=manual??locked??0,f=freq(strs[i].midi),t=ac.currentTime;
  const comp=ac.createDynamicsCompressor(),g=ac.createGain();
  comp.threshold.value=-20;comp.knee.value=10;comp.ratio.value=8;comp.attack.value=.003;comp.release.value=.25;
  g.connect(comp);comp.connect(ac.destination);
  /* graves: más peso en los armónicos (el altavoz no reproduce el fundamental) y más nivel; agudas: sonido más puro y más suave */
  const tl=Math.max(0,Math.min(1,Math.log2(f/82.4)/2)),ear=Math.max(.6,Math.min(1.2,(165/f)**.3)),LO=[1,.7,.5,.35,.25],HI=[1,.4,.15,.05,.02],oscs=[];
  LO.forEach((lo,k)=>{
    const m=k+1,p=f*m,w=lo*(1-tl)+HI[k]*tl,sp=Math.min(1,p/300),a=.2*ear*w/Math.max(sp,.25);
    const o=ac.createOscillator(),h=ac.createGain();o.frequency.value=p;
    h.gain.setValueAtTime(0,t);h.gain.linearRampToValueAtTime(a,t+.012);h.gain.setTargetAtTime(0,t+.02,1.6/Math.sqrt(m));
    o.connect(h);h.connect(g);o.start(t);o.stop(t+7);oscs.push(o);
  });
  $('#ref').textContent='Parar nota';refUntil=performance.now()+5000;
  const tm=setTimeout(stopRef,5000);
  refStop=()=>{clearTimeout(tm);g.gain.setTargetAtTime(0,ac.currentTime,.03);setTimeout(()=>oscs.forEach(o=>{try{o.stop()}catch(e){}}),300)};
};

/* ---------- ajustes ---------- */
function chips(id,items,cur,fn){
  const el=$(id),draw=()=>{el.innerHTML='';items.forEach(([v,l])=>{
    const b=document.createElement('button');b.className='chip'+(String(cur())===String(v)?' sel':'');b.textContent=l;
    b.onclick=()=>{fn(v);save();draw()};el.appendChild(b)})};
  draw();return draw;
}
function setA4(v){S.a4=Math.max(415,Math.min(466,v));$('#a4').textContent=S.a4+' Hz';hist=[];done=[];inSince=0;save();drawA4();drawStrs()}
const drawA4=chips('#c-a4',[[432,'432'],[436,'436'],[440,'440'],[442,'442']],()=>S.a4,setA4);
chips('#c-st',STAB.map((s,i)=>[i,s.n]),()=>S.stab,v=>{S.stab=+v;hist=[]});
$('#tun').innerHTML=Object.keys(TUN).map(k=>`<option>${k} (${TUN[k].replace(/\d/g,'').replace(/#/g,'♯').replace(/b/g,'♭')})</option>`).join('');
$('#tun').selectedIndex=Object.keys(TUN).indexOf(S.tun);
$('#tun').onchange=e=>{S.tun=Object.keys(TUN)[e.target.selectedIndex];save();setTuning()};
document.querySelectorAll('[data-a]').forEach(b=>{
  let h,r;const go=()=>setA4(S.a4+ +b.dataset.a),end=()=>{clearTimeout(h);clearInterval(r)};
  b.onpointerdown=e=>{e.preventDefault();go();h=setTimeout(()=>r=setInterval(go,110),450)};
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,end));
});
{const g=$('#gauge');for(let c=-50;c<=50;c+=10){const t=document.createElement('i');t.className='t'+(c%50===0?' m':'');t.style.left=(50+c)+'%';g.appendChild(t)}}
$('#a4').textContent=S.a4+' Hz';setTuning();
</script>
</body>
</html>
