<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis viajes</title>
<style>
:root{--bg:#eef1f4;--c:#fff;--t:#1b2430;--m:#66707c;--a:#2457c5;--b:#d5dbe2;--ok:#2f855a;--pe:#b7791f;--op:#7a8794}
@media(prefers-color-scheme:dark){:root{--bg:#12161b;--c:#1b2129;--t:#e6eaee;--m:#98a2ad;--a:#7ea4ff;--b:#2c3540;--ok:#5fc08c;--pe:#e3a947;--op:#8a97a5}}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--t);padding-bottom:64px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 12px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--b)}
header select{flex:1;font-weight:600}#mode{color:var(--pe);font-size:13px}
main{max-width:640px;margin:0 auto;padding:8px 12px}
h2{font-size:16px;margin:18px 0 6px}.m{color:var(--m);font-size:13px}
.card{background:var(--c);border:1px solid var(--b);border-left:4px solid var(--ok);border-radius:6px;padding:8px 10px;margin:6px 0}
.card.pend{border-left-color:var(--pe)}.card.opc{border-left-color:var(--op);border-left-style:dashed}
.r{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
.tag{font-size:12px;color:var(--ok)}.tag.pend{color:var(--pe)}.tag.opc{color:var(--op)}
button,select,input,textarea{font:inherit;color:var(--t);background:var(--c);border:1px solid var(--b);border-radius:6px;padding:5px 9px}
button{cursor:pointer}#rp{position:fixed;inset:0;z-index:20;background:#fff;color:#000;overflow:auto;padding:12px;font-size:15px}#rp.big{font-size:19px}#rp .tb{position:sticky;top:0;background:#fff;padding:6px 0;display:flex;gap:8px;border-bottom:1px solid #ccc}#rp button{background:#eee;color:#000;border-color:#999}#rp a{color:#000}#rp h1{font-size:1.5em;margin:10px 0 2px}#rp h2{font-size:1.15em;border-bottom:1px solid #999;margin:18px 0 6px}#rp h3{font-size:1em;margin:12px 0 4px}#rp .li{margin:5px 0}#rp .s{font-size:.85em;color:#333;white-space:pre-wrap;word-break:break-word;padding-left:14px}@media print{body>*:not(#rp){display:none!important}#rp{position:static;overflow:visible;padding:0}#rp .tb{display:none}#rp .pg{break-before:page}#rp .li{break-inside:avoid}}.mini{padding:2px 8px;font-size:12px}body.edit header{border-bottom:3px solid var(--pe)}.nt{color:var(--m);font-size:13px;white-space:pre-wrap}.nt.cl{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}#f_n{min-height:140px}#ts{position:fixed;left:12px;right:12px;bottom:70px;background:var(--t);color:var(--bg);padding:10px 12px;border-radius:8px;display:none;gap:10px;align-items:center;justify-content:space-between;z-index:9}button:disabled{opacity:.4}dialog input[type=checkbox]{width:auto}button.p{background:var(--a);color:#fff;border-color:var(--a)}
a{color:var(--a)}label{display:flex;gap:8px;align-items:center;padding:4px 0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--b)}
nav button{flex:1;border:0;border-radius:0;padding:12px 2px;background:none;font-size:13px}nav button.on{color:var(--a);font-weight:700;box-shadow:inset 0 3px var(--a)}
dialog{max-height:90vh;overflow:auto;width:min(92vw,460px);border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t)}
dialog input,dialog select,dialog textarea{width:100%;margin:3px 0}textarea{min-height:60px}
.done{text-decoration:line-through;color:var(--m)}
:focus-visible{outline:2px solid var(--a);outline-offset:1px}
</style></head><body>
<header><select id="sel" onchange="S.cur=this.value;save(2);render()"></select><span id="mode"></span><button id="em" onclick="toggleEM()"></button></header>
<main id="main"></main>
<nav><button data-t="it" onclick="go('it')">Itinerario</button><button data-t="gs" onclick="go('gs')">Gastos</button><button data-t="id" onclick="go('id')">Ideas</button><button data-t="li" onclick="go('li')">Listas</button><button data-t="en" onclick="go('en')">Notas y enlaces</button><button data-t="da" onclick="go('da')">Datos</button></nav>
<dialog id="dlg"><input id="f_t" placeholder="Hora (ej. 09:30)"><select id="f_ty"></select><input id="f_ti" placeholder="Qué es"><select id="f_st" onchange="cfv()"></select><div id="f_cf"><label>Confirmar antes de <input id="f_due" type="date"></label><input id="f_rb" type="number" min="0" placeholder="o X días antes de la salida"></div><input id="f_pl" placeholder="Dirección o lugar (genera enlace de Maps)"><input id="f_u" placeholder="Enlace web"><textarea id="f_n" placeholder="Notas"></textarea><select id="f_d"></select>
<div class="r"><button class="p" onclick="sv()">Guardar</button><button onclick="dlg.close()">Cancelar</button><button id="del" onclick="rm()">Borrar</button></div></dialog>
<dialog id="dg"></dialog><div id="rp" hidden></div>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const TY={transporte:'🚆',alojamiento:'🏨',comida:'🍽️',visita:'🏛️',paseo:'🚶',otro:'📌'},ST={ok:'Confirmado',pend:'Pendiente',opc:'Opcional'};
const KEY='viajes_v2',esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mapU=p=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p),dirU=p=>'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(p);
let S,tab='it',ed_={},AVO=false;
const cfv=()=>f_cf.style.display=f_st.value=='pend'?'':'none';
const nu=u=>{u=String(u||'').replace(/[\u200B-\u200D\uFEFF]/g,'').replace(/\s+/g,'');if(!u)return'';while(/^https?:\/\/https?:\/\//i.test(u))u=u.replace(/^https?:\/\//i,'');return/^(https?:\/\/|mailto:|tel:)/i.test(u)?u:'https://'+u.replace(/^\/+/,'')};
const dt=(o,t)=>{if(o.due)return o.due;const d0=t.days[0]&&t.days[0].date;if(o.rb!==''&&o.rb!=null&&d0){const d=new Date(d0+'T12:00');d.setDate(d.getDate()-o.rb);return d.toLocaleDateString('sv')}return''};
const dtx=(o,t)=>{const d=dt(o,t);return d?' · 📅 '+d.split('-').reverse().join('/'):(o.rb!==''&&o.rb!=null?' · ⚠️ falta fecha de salida':'')};
function avItems(){const td=new Date().toLocaleDateString('sv'),a=[];S.trips.forEach(t=>{if(t.mode=='view')return;const l=t.days[t.days.length-1];if(l&&l.date&&l.date<td)return;
 const add=(o,k,ti,p,j)=>{const d=dt(o,t);if(d)a.push({d,k,ti,tr:t.name,tid:t.id,p,i:j,id:o.id,n:Math.round((new Date(d+'T12:00')-new Date(td+'T12:00'))/864e5)})};
 t.lists.t.forEach(x=>S.local[x.id]||add(x,'☐',x.ti,'li'));
 t.days.forEach((d,j)=>d.it.forEach(i=>i.st=='pend'&&add(i,'⏳ Confirmar:',i.ti,'it',j)));
 t.gs.forEach(e=>e.st=='pend'&&e.due&&add({id:e.id,due:e.due},'💶 Pagar:',e.ti,'gs'))});return a.sort((x,y)=>x.d<y.d?-1:1)}
function av(){const a=avItems(),g=[a.filter(x=>x.n<0),a.filter(x=>x.n>=0&&x.n<=7),a.filter(x=>x.n>7&&x.n<=21)];if(!g.some(x=>x.length))return'';const HH=['Vencido','Esta semana','Próximas dos semanas'],m=S.trips.length>1;
 return`<details class="card pend" ${AVO?'open':''} ontoggle="AVO=this.open"><summary>🔔 ${g.map((x,k)=>x.length?x.length+' '+['vencidos','esta semana','próximas'][k]:'').filter(Boolean).join(' · ')}</summary>${g.map((x,k)=>x.length?`<h2>${HH[k]}</h2>`+x.map(y=>`<div class="r"><span class="m">${y.d.split('-').reverse().slice(0,2).join('/')}</span><a href="#" onclick="avGo('${y.tid}','${y.p}',${y.i??'null'});return false">${y.k} ${esc(y.ti)}</a>${m?`<span class="m">${esc(y.tr)}</span>`:''}</div>`).join(''):'').join('')}</details>`}
function avGo(id,p,k){S.cur=id;save(2);tab=p;render();if(k!=null){vw=k;render()}scrollTo(0,0)}
function ics(){const a=avItems().filter(x=>x.n>=0);if(!a.length)return toast('No hay recordatorios con fecha');const e=s=>String(s).replace(/[\\;,]/g,'\\$&').replace(/\n/g,'\\n'),z=new Date().toISOString().replace(/[-:]|\.\d+/g,''),L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Mis viajes//ES','CALSCALE:GREGORIAN'];
 a.forEach(x=>{const d=x.d.replace(/-/g,'');L.push('BEGIN:VEVENT','UID:'+x.id+'@viajes','DTSTAMP:'+z,'DTSTART:'+d+'T090000','DTEND:'+d+'T091500','SUMMARY:'+e(x.k+' '+x.ti),'DESCRIPTION:'+e(x.tr),'BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:'+e(x.ti),'END:VALARM','END:VEVENT')});L.push('END:VCALENDAR');
 sendF(new File([L.join('\r\n')],'recordatorios_viajes.ics',{type:'text/calendar'}),'Recordatorios')}
f_ty.innerHTML=Object.keys(TY).map(k=>`<option value="${k}">${TY[k]} ${k}</option>`).join('');
f_st.innerHTML=Object.keys(ST).map(k=>`<option value="${k}">${ST[k]}</option>`).join('');
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 if(!S||!S.trips)S={trips:[],local:{}};S.local=S.local||{};S.trips.forEach(t=>{mig(t);stamp(t,1)});S.cur=S.cur||(S.trips[0]||{}).id}
function save(z){try{const t=T();if(t&&z!==2){t.ch=z===0?0:(t.ch||0)+1;stamp(t);bk(t)}localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('⚠️ No se pudo guardar (almacenamiento lleno). Exporta una copia.')}}
const T=()=>S.trips.find(t=>t.id==S.cur)||S.trips[0],ro=()=>T().mode=='view';
function go(t){tab=t;render();scrollTo(0,0)}
function render(){if(!S.trips.length)return empty();const t=T();S.cur=t.id;if(lc!==t.id){lc=t.id;vw=undefined}if(ro()&&(tab=='gs'||tab=='li'))tab='it';
 $('#sel').innerHTML=S.trips.map(x=>`<option value="${x.id}" ${x.id==t.id?'selected':''}>${esc(x.name)}</option>`).join('');
 $('#mode').textContent=ro()?'Solo consulta':'';em.hidden=ro();em.textContent=EM?'✏️ Edición':'🔒 Consulta';document.body.classList.toggle('edit',ce());
 $('#main').innerHTML=bn(t)+(tab=='it'?av():'')+{it:vIt,gs:vGs,id:vId,li:vLi,en:vEn,da:vDa}[tab](t);
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));document.querySelector('[data-t=gs]').hidden=ro();document.querySelector('[data-t=li]').hidden=ro()}
function find(id){for(const d of T().days){const k=d.it.findIndex(i=>i.id==id);if(k>=0)return{d,k,i:d.it[k]}}}
function vDays(t,days){return days.map(d=>`<h2>${esc(dl(d))}</h2>${d.it.map(i=>`<div class="card ${i.st}"><div class="r"><b>${esc(i.t)||'sin hora'}</b> ${TY[i.ty]||''} <span class="tag ${i.st}">${ST[i.st]}</span></div><div>${esc(i.ti)}</div>${nt(i)}<div class="r">${i.pl?`<a href="${mapU(i.pl)}" target="_blank" rel="noopener">Mapa</a><a href="${dirU(i.pl)}" target="_blank" rel="noopener">Cómo llegar</a>`:''}${i.u?`<a href="${esc(nu(i.u))}" target="_blank" rel="noopener">Enlace</a>`:''}</div>${!ce()?'':`<div class="r"><button onclick="mv('${i.id}',-1)" aria-label="Subir">↑</button><button onclick="mv('${i.id}',1)" aria-label="Bajar">↓</button><button onclick="ed('${d.id}','${i.id}')">Editar</button><select onchange="toDay('${i.id}',this.value)"><option value="">Mover a…</option>${t.days.map(x=>`<option value="${x.id}">${esc(dl(x))}</option>`).join('')}<option value="ideas">Bolsa de ideas</option></select></div>`}</div>`).join('')}${!ce()?'':`<button onclick="ed('${d.id}')">Añadir actividad</button>`}`).join('')}
function mv(id,s){const f=find(id),j=f.k+s;if(j<0||j>=f.d.it.length)return;[f.d.it[f.k],f.d.it[j]]=[f.d.it[j],f.d.it[f.k]];save();render()}
function toDay(id,to){if(!to)return;const f=find(id);f.d.it.splice(f.k,1);if(to=='ideas')T().ideas.push(f.i);else T().days.find(d=>d.id==to).it.push(f.i);save();render()}
function ed(did,iid){const i=iid?(find(iid)||{i:T().ideas.find(x=>x.id==iid)}).i:{t:'',ty:'visita',ti:'',st:'ok',pl:'',u:'',n:'',c:''};ed_={did,iid};
 f_t.value=i.t||'';f_ty.value=i.ty||'visita';f_ti.value=i.ti;f_st.value=i.st||'opc';f_pl.value=i.pl||'';f_u.value=i.u||'';f_n.value=i.n||'';f_due.value=i.due||'';f_rb.value=i.rb??'';cfv();f_d.innerHTML=T().days.map(x=>`<option value="${x.id}">${esc(dl(x))}</option>`).join('')+'<option value="ideas">Bolsa de ideas</option>';f_d.value=did;del.style.display=iid?'':'none';dlg.showModal()}
function sv(){if(!f_ti.value.trim())return f_ti.focus();const t=T(),pd=f_st.value=='pend',o={t:f_t.value.trim(),ty:f_ty.value,ti:f_ti.value.trim(),st:f_st.value,pl:f_pl.value.trim(),u:nu(f_u.value),n:f_n.value.trim(),due:pd?f_due.value:'',rb:pd&&f_rb.value!==''?+f_rb.value:''},to=f_d.value,dd=t.days.find(d=>d.id==to),f=ed_.iid?find(ed_.iid):null,x=ed_.iid&&!f?t.ideas.find(y=>y.id==ed_.iid):null;
 let it=f?f.i:x;if(it)Object.assign(it,o);else it={id:uid(),...o};
 const same=(f&&f.d===dd)||(x&&to=='ideas');if(f&&!same)f.d.it.splice(f.k,1);if(x&&!same)t.ideas.splice(t.ideas.indexOf(x),1);
 if(!same)to=='ideas'?t.ideas.push(it):dd.it.push(it);
 if(dd&&vw!=='all')vw=t.days.indexOf(dd);dlg.close();save();render()}
function rm(){if(!confirm('¿Borrar esta actividad?'))return;U('Actividad borrada');const f=find(ed_.iid);f.d.it.splice(f.k,1);dlg.close();save();render()}
function vId(t){return`<h2>Bolsa de ideas</h2><p class="m">Cosas sin día asignado, para cuando sobre tiempo o cambie el plan.</p>${t.ideas.map(x=>`<div class="card opc"><div>${esc(x.ti)}</div>${nt(x)}<div class="r">${x.pl?`<a href="${mapU(x.pl)}" target="_blank" rel="noopener">Mapa</a>`:''}${x.u?`<a href="${esc(nu(x.u))}" target="_blank" rel="noopener">Enlace</a>`:''}</div>${!ce()?'':`<div class="r"><select onchange="ideaTo('${x.id}',this.value)"><option value="">Pasar al día…</option>${t.days.map(d=>`<option value="${d.id}">${esc(dl(d))}</option>`).join('')}</select><button onclick="ed('ideas','${x.id}')">Editar</button><button onclick="ideaDel('${x.id}')">Quitar</button></div>`}</div>`).join('')||'<p class="m">Vacía.</p>'}${!ce()?'':'<button onclick="ideaAdd()">Añadir idea</button>'}`}
function ideaAdd(){const ti=prompt('Idea');if(!ti)return;T().ideas.push({id:uid(),ti,n:prompt('Nota (opcional)')||''});save();render()}
function ideaDel(id){U('Idea quitada');T().ideas=T().ideas.filter(x=>x.id!=id);save();render()}
function ideaTo(id,to){if(!to)return;const x=T().ideas.find(y=>y.id==id);T().days.find(d=>d.id==to).it.push({t:'',ty:'visita',st:'opc',pl:'',u:'',...x});T().ideas=T().ideas.filter(y=>y.id!=id);save();render()}
function chk(l,k){return l.map(x=>`<label><input type="checkbox" ${S.local[x.id]?'checked':''} onchange="S.local['${x.id}']=this.checked;save(2);render()"><span class="${S.local[x.id]?'done':''}">${esc(x.ti)}</span><span class="m">${dtx(x,T())}</span>${!ce()?'':`<button onclick="listAdd('${k}','${x.id}')" aria-label="Editar">✎</button><button onclick="listDel('${x.id}')" aria-label="Quitar">×</button>`}</label>`).join('')||'<p class="m">Vacía.</p>'}
function vLi(t){const p=[];t.days.forEach(d=>d.it.filter(i=>i.st=='pend').forEach(i=>p.push(`<div class="card pend"><b>${esc(i.ti)}</b><div class="m">${esc(dl(d))}${i.n?' · '+esc(i.n):''}</div></div>`)));
 return`<h2>Por confirmar (${p.length})</h2>${p.join('')||'<p class="m">Nada pendiente.</p>'}<h2>Lista del viaje</h2>${chk(t.lists.t,'t')}${!ce()?'':'<button onclick="listAdd(\'t\')">Añadir</button>'}<h2>Lista genérica</h2>${chk(t.lists.g,'g')}${!ce()?'':'<button onclick="listAdd(\'g\')">Añadir</button> <button onclick="listCopy()">Copiar genérica al viaje</button>'}`}
function listAdd(k,id){const t=T(),x=id?t.lists[k].find(y=>y.id==id):{};dg.innerHTML=`<input id="l_ti" placeholder="Elemento" value="${esc(x.ti||'')}">${k=='t'?`<label>Fecha límite <input id="l_due" type="date" value="${x.due||''}"></label>`:''}<input id="l_rb" type="number" min="0" placeholder="o X días antes de la salida" value="${x.rb??''}"><div class="r"><button class="p" onclick="listSv('${k}','${id||''}')">Guardar</button><button onclick="dg.close()">Cancelar</button></div>`;dg.showModal()}
function listSv(k,id){const ti=l_ti.value.trim();if(!ti)return l_ti.focus();const L=T().lists[k],o={ti,due:(k=='t'&&l_due.value)||'',rb:l_rb.value===''?'':+l_rb.value};if(id)Object.assign(L.find(y=>y.id==id),o);else L.push({id:uid(),...o});dg.close();save();render()}
function listDel(id){U('Elemento quitado');const l=T().lists;l.g=l.g.filter(x=>x.id!=id);l.t=l.t.filter(x=>x.id!=id);save();render()}
function listCopy(){const l=T().lists;l.g.forEach(x=>l.t.push({id:uid(),ti:x.ti,rb:x.rb}));save();render()}
function vEn(t){const a=[],E=ce();t.days.forEach(d=>d.it.forEach(i=>{if(i.u)a.push(`<a href="${esc(nu(i.u))}" target="_blank" rel="noopener">${esc(i.ti)}</a>`);if(i.pl)a.push(`<a href="${mapU(i.pl)}" target="_blank" rel="noopener">Mapa: ${esc(i.ti)}</a>`)}));
 const lk=(x,b)=>`<div class="r"><a href="${esc(nu(x.u))}" target="_blank" rel="noopener">${esc(x.l)}</a>${E?b:''}</div>`;
 return`<h2>Notas del viaje</h2>${t.notes.map(n=>`<div class="card"><b>${esc(n.ti)}</b>${n.pv?' 🔒':''}${nt(n)}${E?`<div class="r"><button class="mini" onclick="noteE('${n.id}')">Editar</button></div>`:''}</div>`).join('')||'<p class="m">Sin notas.</p>'}${E?'<button onclick="noteE()">Añadir nota</button>':''}
<h2>Enlaces del viaje</h2>${t.links.map((x,k)=>lk(x,`<button onclick="lnDel(${k})" aria-label="Quitar">×</button>`)).join('')}${E?'<button onclick="lnAdd()">Añadir enlace</button>':''}
${ro()?'':`<h2>Enlaces genéricos</h2>${t.glinks.map((x,k)=>lk(x,`<button class="mini" onclick="glTo(${k})">Pasar al viaje</button><button onclick="glDel(${k})" aria-label="Quitar">×</button>`)).join('')||'<p class="m">Vacío.</p>'}${E?'<button onclick="glAdd()">Añadir enlace genérico</button>':''}`}
<h2>Del itinerario</h2>${a.map(x=>`<div>${x}</div>`).join('')||'<p class="m">Ninguno.</p>'}`}
function lnAdd(){const u=nu(prompt('URL'));if(!u)return;T().links.push({id:uid(),l:prompt('Nombre')||u,u});save();render()}
function glAdd(){const u=nu(prompt('URL'));if(!u)return;T().glinks.push({id:uid(),l:prompt('Nombre')||u,u});save();render()}
function glTo(k){const x=T().glinks[k];T().links.push({id:uid(),l:x.l,u:x.u});save();render();toast('Añadido a los enlaces del viaje')}
function glDel(k){U('Enlace quitado');T().glinks.splice(k,1);save();render()}
function noteE(id){const x=id?T().notes.find(y=>y.id==id):{ti:'',n:'',pv:0};dg.innerHTML=`<input id="n_ti" placeholder="Título" value="${esc(x.ti)}"><textarea id="n_n" placeholder="Texto (los enlaces se pueden pulsar)" style="min-height:260px">${esc(x.n)}</textarea><label><input type="checkbox" id="n_pv" ${x.pv?'checked':''}>Privada (no va en el archivo de acompañantes)</label><div class="r"><button class="p" onclick="noteS('${id||''}')">Guardar</button><button onclick="dg.close()">Cancelar</button>${id?`<button onclick="noteD('${id}')">Borrar</button>`:''}</div>`;dg.showModal()}
function noteS(id){const ti=n_ti.value.trim();if(!ti)return n_ti.focus();const o={ti,n:n_n.value.trim(),pv:n_pv.checked?1:0};if(id)Object.assign(T().notes.find(y=>y.id==id),o);else T().notes.push({id:uid(),...o});dg.close();save();render()}

function bkRes(at){let x;try{x=JSON.parse(localStorage.getItem(BK)||'[]').find(y=>y.id==S.cur&&y.at==at)}catch(e){}if(!x||!confirm('¿Restaurar la copia del '+new Date(at).toLocaleString('es')+'? Sustituye el estado actual (podrás deshacer unos segundos).'))return;U('Copia restaurada');const t=JSON.parse(x.j);S.trips[S.trips.findIndex(y=>y.id==t.id)]=t;stamp(t,1);save();render()}
const bn=t=>!ro()&&(t.ch||0)>=25?`<div class="card pend">⚠️ ${t.ch} cambios sin exportar. <button class="mini" onclick="go('da')">Ir a Datos</button></div>`:'';
function U(m){const t=T();UD={j:JSON.stringify(t)};toast(m,1)}
function toast(m,u){let e=$('#ts');if(!e){e=document.createElement('div');e.id='ts';document.body.appendChild(e)}e.innerHTML='<span>'+esc(m)+'</span>'+(u?'<button onclick="undo()">Deshacer</button>':'');e.style.display='flex';clearTimeout(utm);utm=setTimeout(()=>e.style.display='none',9000)}
function undo(){if(!UD)return;const t=JSON.parse(UD.j),k=S.trips.findIndex(x=>x.id==t.id);k<0?S.trips.push(t):S.trips[k]=t;S.cur=t.id;stamp(t,1);UD=null;$('#ts').style.display='none';save();render()}

async function sendF(f,ti){if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:ti});return}catch(e){if(e.name=='AbortError')return}}const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click()}
function repUI(){const t=T(),r=ro(),ck=(i,l,v)=>`<label><input type="checkbox" id="${i}" ${v?'checked':''}>${l}</label>`;
 dg.innerHTML=`<h2 style="margin-top:0">Crear informe</h2>${ck('r_it','Itinerario',1)}<select id="r_day"><option value="all">Todo el viaje</option>${t.days.map(d=>`<option value="${d.id}">${esc(dl(d))}</option>`).join('')}</select>${ck('r_en','Enlaces',1)}${ck('r_nt','Notas del viaje',1)}${r?'':ck('r_li','Pendientes y listas',1)+ck('r_gs','Cuentas')}${ck('r_n','Incluir notas',1)}${ck('r_u','Incluir enlaces web completos',1)}${ck('r_pk','Formato de bolsillo (solo horas y lugares, letra grande)')}<div class="r"><button class="p" onclick="repGo(0)">Ver / PDF</button><button onclick="repGo(1)">Texto (.txt)</button><button onclick="dg.close()">Cancelar</button></div>`;dg.showModal()}
function repGo(m){const g=i=>!!$('#'+i)&&$('#'+i).checked,o={it:g('r_it'),day:$('#r_day').value,en:g('r_en'),li:g('r_li'),gs:g('r_gs'),n:g('r_n'),u:g('r_u'),pk:g('r_pk'),nt:g('r_nt')},B=repB(o);dg.close();
 if(m)return sendF(new File([repT(B)],T().name.replace(/\W+/g,'_')+'_informe.txt',{type:'text/plain'}),T().name);
 rp.className=o.pk?'big':'';rp.innerHTML='<div class="tb"><button onclick="print()">Imprimir / Guardar PDF</button><button onclick="rp.hidden=true">Cerrar</button></div>'+repH(B);rp.hidden=false;rp.scrollTop=0}
function repB(o){const t=T(),B=[],n=o.n&&!o.pk,u=o.u&&!o.pk;B.push({k:'h1',t:t.name},{k:'p',t:'Informe del '+new Date().toLocaleDateString('es')+' · versión '+(t.v||1)});
 if(o.it){(o.day=='all'?t.days:t.days.filter(d=>d.id==o.day)).forEach(d=>{B.push({k:'h2',t:dl(d),pg:1});d.it.forEach(i=>{const s=[];if(i.pl)s.push('Lugar: '+i.pl);if(n&&i.n)s.push(i.n);if(u&&i.u)s.push('Web: '+i.u);B.push({k:'li',t:(i.t||'--:--')+'  '+i.ti+(i.st!='ok'?' ('+ST[i.st].toLowerCase()+')':''),s:s.join('\n')})})});
  if(o.day=='all'&&t.ideas.length){B.push({k:'h2',t:'Bolsa de ideas',pg:1});t.ideas.forEach(x=>B.push({k:'li',t:x.ti,s:n?x.n:''}))}}
 if(o.en){B.push({k:'h2',t:'Enlaces',pg:1});t.links.forEach(x=>B.push({k:'li',t:x.l,s:x.u}));const a=[];t.days.forEach(d=>d.it.forEach(i=>{const s=[];if(i.u)s.push(i.u);if(i.pl)s.push('Lugar: '+i.pl);if(s.length)a.push({k:'li',t:i.ti+' ('+dl(d)+')',s:s.join('\n')})}));if(a.length)B.push({k:'h3',t:'Del itinerario'},...a)}
 if(o.nt&&t.notes.length){B.push({k:'h2',t:'Notas',pg:1});t.notes.forEach(x=>B.push({k:'li',t:x.ti,s:x.n}))}
 if(o.li&&!ro()){B.push({k:'h2',t:'Pendientes y listas',pg:1});const p=[];t.days.forEach(d=>d.it.filter(i=>i.st=='pend').forEach(i=>p.push({k:'li',t:i.ti,s:dl(d)})));B.push({k:'h3',t:'Por confirmar ('+p.length+')'},...p);[['Lista del viaje',t.lists.t],['Lista genérica',t.lists.g]].forEach(([h,l])=>B.push({k:'h3',t:h},...l.map(x=>({k:'li',t:(S.local[x.id]?'[x] ':'[ ] ')+x.ti}))))}
 if(o.gs&&!ro()){const k=calc(t),mu=t.groups.length>1,me=k.sp[t.me]||0,P=(a,b)=>B.push({k:'li',t:a+': '+eur(b)});B.push({k:'h2',t:'Cuentas',pg:1},{k:'h3',t:'Resumen'});P('Total del viaje',k.tot);if(mu)P('Tu parte',me);P('Pendiente de pagar',mu?k.mePend:k.pend);if(t.bud)P('Presupuesto restante',t.bud*100-me);
  B.push({k:'h3',t:'Por categoría'});Object.entries(k.cat).forEach(([c,v])=>P(c,v));
  if(mu){B.push({k:'h3',t:'Cuentas entre grupos'});const st=settle(k.net);if(!st.length)B.push({k:'p',t:'Todo saldado.'});st.forEach(([a,b,m])=>B.push({k:'li',t:gn(t,a)+' debe '+eur(m)+' a '+gn(t,b)}))}
  B.push({k:'h3',t:'Gastos'});t.gs.forEach(e=>B.push({k:'li',t:e.ti+' — '+eur(Math.round(e.amt*100)),s:[e.cat,mu?'paga '+gn(t,e.pay):'',e.met,e.st=='pend'?'pendiente'+(e.due?' hasta '+e.due:''):''].filter(Boolean).join(' · ')}))}
 return B}
const repT=B=>B.map(b=>b.k=='h1'?b.t.toUpperCase()+'\n':b.k=='h2'?'\n=== '+b.t+' ===':b.k=='h3'?'\n-- '+b.t:b.k=='p'?b.t:'- '+b.t+(b.s?'\n'+b.s.split('\n').map(x=>'    '+x).join('\n'):'')).join('\n');
function repH(B){let c=0;return B.map(b=>{const t=esc(b.t).replace(/^\[x\] /,'☑ ').replace(/^\[ \] /,'☐ ');return b.k=='h1'?`<h1>${t}</h1>`:b.k=='h2'?`<h2 class="${c++&&b.pg?'pg':''}">${t}</h2>`:b.k=='h3'?`<h3>${t}</h3>`:b.k=='p'?`<p>${t}</p>`:`<div class="li"><b>${t}</b>${b.s?`<div class="s">${esc(b.s).replace(/https?:\/\/[^\s<]+[^\s<.,;:!?)]/g,u=>`<a href="${u}">${u}</a>`)}</div>`:''}</div>`}).join('')}
load();render();
</script></body></html>
