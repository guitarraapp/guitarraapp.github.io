<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15171d">
<title>Metrónomo</title>
<style>
:root{--bg:#15171d;--panel:#1e2128;--line:#32363f;--amber:#ffb224;--soft:#e9e6dd;--mute:#ff5a4d;--tx:#f4f2ec;--dim:#9a9ca6}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,label{touch-action:manipulation}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);display:flex;justify-content:center;overscroll-behavior:none}
#app{width:100%;max-width:480px;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 14px 0}
header{display:flex;justify-content:space-between;align-items:center;height:34px;font-size:.95rem;font-weight:600;color:var(--amber)}
header .mu{color:var(--mute)}#time{color:var(--dim);font-variant-numeric:tabular-nums}
#prog{height:3px;background:var(--line);border-radius:2px;overflow:hidden}#bar{display:block;height:100%;width:0;background:var(--amber)}
main{flex:1;overflow-y:auto;padding:14px 0}
#pads{display:flex;gap:8px}
.pad{flex:1;height:64px;border-radius:14px;border:2px solid var(--line);background:var(--panel);color:var(--dim);font-size:1.1rem;font-weight:700;transition:background .06s}
.pad.l2{border-color:var(--amber);color:var(--amber)}.pad.l1{border-color:#6b6e79}.pad.l0{opacity:.3;border-style:dashed}
.pad.on{background:var(--soft);color:#111}.pad.on.l2{background:var(--amber)}.pad.mu.on{background:var(--mute);color:#fff}
.hint{font-size:.78rem;color:var(--dim);text-align:center;margin:8px 0 6px}
.bpmrow{display:flex;align-items:center;justify-content:space-between;margin:6px 0}
.bpmrow button{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--tx);font-size:1.15rem;font-weight:700}
.bpmrow button:active{background:var(--amber);color:#111}
.bw{text-align:center}
#bpm{font-family:"Avenir Next Condensed","Arial Narrow",Impact,sans-serif;font-size:clamp(5rem,24vw,7.5rem);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;touch-action:none;user-select:none;cursor:ns-resize}
#tn{font-size:.85rem;color:var(--dim);margin-top:2px}
.sl{display:flex;gap:12px;align-items:center;margin:8px 0 14px}
input[type=range]{flex:1;width:100%;height:36px;accent-color:var(--amber)}
#tap{height:44px;padding:0 20px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--tx);font-weight:700;font-size:1rem}
#tap:active{background:var(--amber);color:#111}
#tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:12px}
#tabs button{flex:1;padding:12px 0;background:none;border:0;border-bottom:3px solid transparent;color:var(--dim);font-size:1rem;font-weight:600}
#tabs .sel{color:var(--tx);border-color:var(--amber)}
section{display:flex;flex-direction:column;gap:10px}section[hidden]{display:none}
h3{font-size:.85rem;font-weight:600;color:var(--dim);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--tx);font-size:1rem}
.chip.sel{background:var(--amber);color:#111;border-color:var(--amber);font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:1rem;min-height:44px}
.row.s{justify-content:flex-start;flex-wrap:wrap;color:var(--dim);font-size:.95rem;min-height:0}
.row.s span{color:var(--dim)}
input[type=number]{width:64px;height:40px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--tx);font-size:16px}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:14px;background:#3a3e48;position:relative;flex:none}
input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}
input[type=checkbox]:checked{background:var(--amber)}input[type=checkbox]:checked::after{transform:translateX(20px)}
footer{padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
#play{width:100%;height:64px;border-radius:18px;border:0;background:var(--amber);color:#111;font-size:1.3rem;font-weight:800}
#play.on{background:var(--mute);color:#fff}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media (orientation:landscape) and (max-height:520px){
#app{max-width:none}main{display:flex;gap:24px}#l,#r{flex:1;min-width:0}#bpm{font-size:4.5rem}.pad{height:48px}}
</style>
</head>
<body>
<div id="app">
<header><span id="st"></span><span id="time"></span></header>
<div id="prog"><i id="bar"></i></div>
<main>
<div id="l">
<div id="pads"></div>
<p class="hint">Toca un tiempo para cambiarlo: acento, normal o silencio</p>
<div class="bpmrow">
<button data-d="-5" aria-label="Bajar 5 BPM">−5</button>
<button data-d="-1" aria-label="Bajar 1 BPM">−</button>
<div class="bw"><div id="bpm" title="Arrastra arriba o abajo">80</div><div id="tn"></div></div>
<button data-d="1" aria-label="Subir 1 BPM">+</button>
<button data-d="5" aria-label="Subir 5 BPM">+5</button>
</div>
<div class="sl"><input type="range" id="sl" min="30" max="250" aria-label="BPM"><button id="tap">Tap</button></div>
</div>
<div id="r">
<nav id="tabs"><button class="sel" data-t="0">Ritmo</button><button data-t="1">Sonido</button><button data-t="2">Práctica</button></nav>
<section id="p0">
<h3>Compás</h3><div class="chips" id="c-ts"></div>
<h3>Subdivisión</h3><div class="chips" id="c-sub"></div>
</section>
<section id="p1" hidden>
<h3>Sonido</h3><div class="chips" id="c-snd"></div>
<div class="row"><span>Volumen</span><input type="range" data-k="vol" min="0" max="100" aria-label="Volumen" style="max-width:60%"></div>
</section>
<section id="p2" hidden>
<h3>Temporizador</h3><div class="chips" id="c-tm"></div>
<h3>Compases mudos</h3>
<div class="row"><span>Alternar sonido y silencio</span><input type="checkbox" data-k="mOn" aria-label="Activar compases mudos"></div>
<div class="row s"><span>Suenan</span><input type="number" data-k="mP" min="1"><span>y se silencian</span><input type="number" data-k="mM" min="1"><span>compases</span></div>
<h3>Entrenador de velocidad</h3>
<div class="row"><span>Subir el tempo solo</span><input type="checkbox" data-k="tOn" aria-label="Activar entrenador"></div>
<div class="row s"><span>Subir</span><input type="number" data-k="tInc" min="1"><span>BPM cada</span><input type="number" data-k="tEvery" min="1"><span>compases, hasta</span><input type="number" data-k="tMax" min="30"><span>BPM</span></div>
</section>
</div>
</main>
<footer><button id="play">Iniciar</button></footer>
</div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const METERS={'2/4':{n:2,s:[0]},'3/4':{n:3,s:[0]},'4/4':{n:4,s:[0]},'5/4':{n:5,s:[0,3]},'6/8':{n:2,s:[0],sub:3,u:'♩.'},'7/8':{n:7,s:[0,2,4],u:'♪'}};
const NAMES=[[60,'Largo'],[66,'Larghetto'],[76,'Adagio'],[108,'Andante'],[120,'Moderato'],[168,'Allegro'],[200,'Vivace'],[999,'Presto']];
let S={bpm:80,ts:'4/4',sub:1,snd:'digital',vol:80,mOn:false,mP:2,mM:2,tOn:false,tInc:4,tEvery:4,tMax:120,tm:0,acc:null};
try{Object.assign(S,JSON.parse(localStorage.getItem('metro2')||'{}'))}catch(e){}
const Q0=new URLSearchParams(location.search);
if(+Q0.get('bpm')>=30&&+Q0.get('bpm')<=250)S.bpm=+Q0.get('bpm');
if(METERS[Q0.get('ts')])S.ts=Q0.get('ts');
if([1,2,3,4].includes(+Q0.get('sub')))S.sub=+Q0.get('sub');
const save=()=>{try{localStorage.setItem('metro2',JSON.stringify(S))}catch(e){}};
const defAcc=()=>{const m=METERS[S.ts];return Array.from({length:m.n},(_,i)=>m.s.includes(i)?2:1)};
if(!S.acc||S.acc.length!==METERS[S.ts].n)S.acc=defAcc();

/* ---------- audio ---------- */
let ac,noise,playing=false,beat=0,step=0,next=0,bars=0,muted=false,endAt=0,b0=0,stopClock=null,Q=[],pads=[],wl=null;
function silentWav(){const n=800,b=new Uint8Array(44+n),v=new DataView(b.buffer),w=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);b.fill(128,44);
return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}
const sil=new Audio(silentWav());sil.loop=true; /* mantiene el audio activo en iOS con el interruptor de silencio */
function initAudio(){
  if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();noise=ac.createBuffer(1,ac.sampleRate*.1,ac.sampleRate);
    const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  if(ac.state!=='running')ac.resume();
}
function tone(type,f,t,d,dest){const o=ac.createOscillator();o.type=type;o.frequency.value=f;o.connect(dest);o.start(t);o.stop(t+d+.02)}
function click(t,lvl,sub){
  const hi=lvl===2,k=sub?.8:1,d=S.snd==='cow'?.14:.06;
  const v=S.vol/100*(sub?.35:hi?1:.7)*(S.snd==='cow'?.45:1);if(v<=0)return;
  const g=ac.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.002);g.gain.exponentialRampToValueAtTime(.0001,t+d);g.connect(ac.destination);
  if(S.snd==='digital'){tone('sine',(hi?1600:1100)*k,t,d,g)}
  else if(S.snd==='wood'){
    const f=ac.createBiquadFilter(),b=ac.createGain(),s=ac.createBufferSource();f.type='bandpass';f.frequency.value=(hi?1800:1200)*k;f.Q.value=8;b.gain.value=4;
    s.buffer=noise;s.connect(f);f.connect(b);b.connect(g);s.start(t);s.stop(t+d);tone('triangle',(hi?900:650)*k,t,d,g)}
  else{
    const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=800;f.Q.value=.8;f.connect(g);
    tone('square',540*(hi?1.12:1)*k,t,d,f);tone('square',800*(hi?1.12:1)*k,t,d,f)}
}

/* ---------- planificador ---------- */
function barStart(){
  if(S.tOn&&bars%S.tEvery===0&&S.bpm<S.tMax){S.bpm=Math.min(S.tMax,S.bpm+S.tInc);showBpm()}
  if(S.mOn){muted=(bars%(S.mP+S.mM))>=S.mP}else muted=false;
}
function sched(){
  if(!playing)return;
  while(next<ac.currentTime+.12){
    const lvl=S.acc[beat]??1,m=muted&&S.mOn;
    if(step===0)Q.push({t:next,i:beat,m});
    if(lvl>0&&!m)click(next,step>0?1:lvl,step>0);
    next+=60/S.bpm/S.sub;
    if(++step>=S.sub){step=0;if(++beat>=METERS[S.ts].n){beat=0;bars++;barStart()}}
  }
}
function startClock(){
  try{const w=new Worker(URL.createObjectURL(new Blob(['setInterval(()=>postMessage(0),25)'])));w.onmessage=sched;stopClock=()=>w.terminate()}
  catch(e){const id=setInterval(sched,25);stopClock=()=>clearInterval(id)}
}
function draw(){
  if(!playing)return;
  while(Q.length&&Q[0].t<=ac.currentTime){
    const e=Q.shift();pads.forEach((p,i)=>{p.classList.toggle('on',i===e.i);p.classList.toggle('mu',e.m)});
    stat(S.mOn?(e.m?'Silencio':'Suena'):'',e.m);
  }
  if(endAt){
    const r=Math.max(0,endAt-Date.now());$('#time').textContent=fmt(r);$('#bar').style.width=(100-r/(S.tm*600))+'%';
    if(r<=0){stop('Sesión terminada');done();return}
  }
  requestAnimationFrame(draw);
}
function done(){
  if(navigator.vibrate)navigator.vibrate([200,100,200,100,200]);
  const g=ac.createGain();g.gain.value=Math.max(.2,S.vol/100*.5);g.connect(ac.destination);
  for(let i=0;i<3;i++)tone('sine',880,ac.currentTime+i*.28,.16,g);
}

/* ---------- control ---------- */
async function lock(on){try{if(on)wl=await navigator.wakeLock.request('screen');else if(wl){wl.release();wl=null}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(playing&&document.visibilityState==='visible')lock(true)});
function start(){
  initAudio();sil.play().catch(()=>{});
  playing=true;beat=step=bars=0;muted=false;Q=[];b0=S.bpm;next=ac.currentTime+.08;
  endAt=S.tm?Date.now()+S.tm*60000:0;
  $('#play').textContent='Detener';$('#play').classList.add('on');stat(S.mOn?'Suena':'');
  startClock();lock(true);requestAnimationFrame(draw);
}
function stop(msg){
  playing=false;stopClock&&stopClock();sil.pause();lock(false);endAt=0;
  if(S.tOn&&b0){S.bpm=b0;showBpm()}
  $('#play').textContent='Iniciar';$('#play').classList.remove('on');
  pads.forEach(p=>p.classList.remove('on','mu'));$('#bar').style.width=0;showTime();stat(msg||'');
}
$('#play').onclick=()=>playing?stop():start();
const stat=(t,m)=>{const s=$('#st');s.textContent=t;s.className=m?'mu':''};
const fmt=ms=>{const s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const showTime=()=>{$('#time').textContent=S.tm?S.tm+':00':''};

/* ---------- BPM ---------- */
function showBpm(){
  $('#bpm').textContent=S.bpm;$('#sl').value=S.bpm;
  $('#tn').textContent=NAMES.find(n=>S.bpm<n[0])[1]+'  ·  '+(METERS[S.ts].u||'♩')+' = '+S.bpm;
}
function setBpm(v){S.bpm=Math.max(30,Math.min(250,Math.round(v)));showBpm();save()}
$('#sl').oninput=e=>setBpm(+e.target.value);
$$('[data-d]').forEach(b=>{
  let h,r;const go=()=>setBpm(S.bpm+ +b.dataset.d),end=()=>{clearTimeout(h);clearInterval(r)};
  b.onpointerdown=e=>{e.preventDefault();go();h=setTimeout(()=>r=setInterval(go,90),400)};
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,end));
});
{const nb=$('#bpm');let y0=null,v0=0;
nb.onpointerdown=e=>{y0=e.clientY;v0=S.bpm;nb.setPointerCapture(e.pointerId)};
nb.onpointermove=e=>{if(y0!==null)setBpm(v0+(y0-e.clientY)/5)};
nb.onpointerup=nb.onpointercancel=()=>y0=null}
let taps=[];
function tap(){
  const n=performance.now();if(taps.length&&n-taps[taps.length-1]>2000)taps=[];
  taps=[...taps,n].slice(-6);
  if(taps.length>1)setBpm(60000/((taps[taps.length-1]-taps[0])/(taps.length-1)));
}
$('#tap').onpointerdown=e=>{e.preventDefault();tap()};

/* ---------- interfaz ---------- */
const R={};
function chips(id,key,items,fn){
  const el=$(id);
  R[key]=()=>{el.innerHTML='';items.forEach(([v,l])=>{
    const b=document.createElement('button');b.className='chip'+(String(S[key])===String(v)?' sel':'');b.textContent=l;
    b.onclick=()=>{S[key]=typeof S[key]==='number'?+v:v;fn&&fn(v);save();R[key]()};el.appendChild(b)})};
  R[key]();
}
function buildPads(){
  const el=$('#pads');el.innerHTML='';
  pads=S.acc.map((l,i)=>{
    const p=document.createElement('button');p.className='pad l'+l;p.textContent=i+1;p.setAttribute('aria-label','Tiempo '+(i+1));
    p.onclick=()=>{S.acc[i]=(S.acc[i]+2)%3;p.className=p.className.replace(/l\d/,'l'+S.acc[i]);save()};
    el.appendChild(p);return p});
}
chips('#c-ts','ts',Object.keys(METERS).map(k=>[k,k]),v=>{S.sub=METERS[v].sub||1;S.acc=defAcc();buildPads();R.sub();showBpm();if(playing){beat=step=0}});
chips('#c-sub','sub',[[1,'♩ 1×'],[2,'♫ 2×'],[3,'♪♪♪ 3×'],[4,'♬ 4×']]);
chips('#c-snd','snd',[['digital','Digital'],['wood','Madera'],['cow','Cencerro']]);
chips('#c-tm','tm',[[0,'Sin límite'],[5,'5 min'],[10,'10 min'],[15,'15 min'],[30,'30 min']],()=>{if(!playing)showTime()});
$$('[data-k]').forEach(e=>{
  const k=e.dataset.k,c=e.type==='checkbox';c?e.checked=S[k]:e.value=S[k];
  const upd=()=>{S[k]=c?e.checked:Math.max(+e.min||0,+e.value||+e.min||0);save()};
  e.oninput=upd;e.onchange=()=>{upd();if(!c&&e.type!=='range')e.value=S[k]};
});
$$('#tabs button').forEach(b=>b.onclick=()=>{
  $$('#tabs button').forEach(x=>x.classList.toggle('sel',x===b));
  [0,1,2].forEach(i=>$('#p'+i).hidden=i!==+b.dataset.t);
});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'&&e.target.type==='number')return;
  const st=e.shiftKey?5:1;
  if(e.code==='Space'){e.preventDefault();playing?stop():start()}
  else if(e.key==='ArrowUp'||e.key==='ArrowRight'){e.preventDefault();setBpm(S.bpm+st)}
  else if(e.key==='ArrowDown'||e.key==='ArrowLeft'){e.preventDefault();setBpm(S.bpm-st)}
  else if(e.key==='t'||e.key==='T')tap();
});
buildPads();showBpm();showTime();
</script>
</body>
</html>
